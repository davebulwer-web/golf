<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golf</title>
<style>
  html, body { margin: 0; height: 100%; background: #14101f; overflow: hidden; }
  canvas { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #hud { pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="hud"></canvas>
<script>
(() => {
// ---- course-generator.js ----
// Course generator, extracted from the Golf manager game (golf-poc/golf.js).
// One seed always builds the same 18-hole course. No dependencies; runs in
// Node and in the browser as an ES module.
//
// The section between the "COPIED VERBATIM" markers is unchanged from golf.js
// so courses match the original game exactly. Don't edit it unless you're happy
// for every existing seed to change shape. New features should use their own
// random stream (see r2 and r3 in generateHole) so old holes keep their shape.
// Units are yards.

// ===== COPIED VERBATIM from golf-poc/golf.js (2026-10-27) =====

// ---------- Random numbers ----------

function makeRng(seed) {
  let a = seed >>> 0;
  const next = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const rng = {
    next,
    range: (lo, hi) => lo + (hi - lo) * next(),
    int: (lo, hi) => lo + Math.floor((hi - lo + 1) * next()),
    chance: (p) => next() < p,
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    gauss: () => {
      let u = 0;
      while (u === 0) u = next();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * next());
    },
    shuffle: (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    },
  };
  return rng;
}

// ---------- Geometry ----------

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// A hole's centre line is a polyline from tee to green. These helpers convert
// between world points and (s = yards along the line, lat = yards off it).
function buildLine(points) {
  const segs = [];
  let s = 0;
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    const len = dist(a, b);
    segs.push({ a, b, len, s0: s, ux: (b.x - a.x) / len, uy: (b.y - a.y) / len });
    s += len;
  }
  return { points, segs, length: s };
}

function project(line, p) {
  let best = null;
  for (const g of line.segs) {
    let t = (p.x - g.a.x) * g.ux + (p.y - g.a.y) * g.uy;
    const before = t < 0, after = t > g.len;
    // Let the first and last segments extend past the ends of the line.
    if (before && g !== line.segs[0]) t = 0;
    if (after && g !== line.segs[line.segs.length - 1]) t = g.len;
    const cx = g.a.x + g.ux * t, cy = g.a.y + g.uy * t;
    const lat = (p.x - g.a.x) * -g.uy + (p.y - g.a.y) * g.ux;
    const d = Math.hypot(p.x - cx, p.y - cy);
    if (!best || d < best.d) best = { s: g.s0 + t, lat, d };
  }
  return best;
}

function pointAt(line, s, lat = 0) {
  let g = line.segs[line.segs.length - 1];
  for (const seg of line.segs) {
    if (s <= seg.s0 + seg.len) { g = seg; break; }
  }
  const t = s - g.s0;
  return { x: g.a.x + g.ux * t - g.uy * lat, y: g.a.y + g.uy * t + g.ux * lat };
}

// Organic shapes: a circle whose radius wobbles with angle, optionally
// stretched and rotated. Used for greens, bunkers and water.
function makeBlob(r, x, y, R, amp = 0.25, stretch = [1, 1.4], rot = null) {
  const h = [];
  let left = amp;
  for (let k = 2; k <= 5 && left > 0.01; k++) {
    const a = k === 5 ? left : r.range(0.3, 0.7) * left;
    h.push([k, a, r.range(0, Math.PI * 2)]);
    left -= a;
  }
  return { x, y, r: R, rot: rot ?? r.range(0, Math.PI), sx: r.range(...stretch), h };
}

// Yards from a point to the blob's edge: negative inside, positive outside.
function blobGap(b, p) {
  const dx = p.x - b.x, dy = p.y - b.y;
  const c = Math.cos(-b.rot), s = Math.sin(-b.rot);
  const u = (dx * c - dy * s) / b.sx, v = dx * s + dy * c;
  const d = Math.hypot(u, v);
  if (d > b.r * 1.6 + 15) return d - b.r * 1.5; // far away, skip the trig
  const th = Math.atan2(v, u);
  let f = 1;
  for (const [k, a, ph] of b.h) f += a * Math.sin(k * th + ph);
  return d - b.r * f;
}

// A point inside a blob, `frac` of the way from centre to edge at angle `th`.
function blobPoint(b, th, frac) {
  let f = 1;
  for (const [k, a, ph] of b.h) f += a * Math.sin(k * th + ph);
  const u = Math.cos(th) * b.r * f * frac * b.sx, v = Math.sin(th) * b.r * f * frac;
  return { x: b.x + u * Math.cos(b.rot) - v * Math.sin(b.rot), y: b.y + u * Math.sin(b.rot) + v * Math.cos(b.rot) };
}

// Smooth wobble along the hole, used to bend fairway and rough edges.
const wobble = (ph, s) => 0.22 * Math.sin(s / 41 + ph[0]) + 0.12 * Math.sin(s / 19 + ph[1]) + 0.06 * Math.sin(s / 8 + ph[2]);

// ---------- Course styles ----------

// Each style changes how holes are laid out, how the course plays in the
// weather, and (in the viewer) how it looks. Ranges are [min, max].
const STYLES = {
  parkland: {
    name: 'Parkland', fwHalf: [13, 22], roughW: [14, 28], wasteW: [0, 0], greenR: [12, 17],
    dogleg: 0.65, bend: 45, fwBunkers: [0, 2], fwBunkerR: [8, 13], potBunkers: false,
    gsBunkers: [1, 3], gsBunkerR: [5, 9], water: [0.4, 0.3], greenWater: [0.3, 0.2], sea: 0, carry: false,
    sharpDogleg: 0.08, wind: [0, 10], firm: [0, 0.03],
  },
  links: {
    name: 'Links', fwHalf: [17, 27], roughW: [8, 16], wasteW: [0, 0], greenR: [14, 20],
    dogleg: 0.4, bend: 30, fwBunkers: [1, 4], fwBunkerR: [4, 7], potBunkers: true,
    gsBunkers: [2, 4], gsBunkerR: [3.5, 6], water: [0.1, 0.1], greenWater: [0, 0], sea: 0.4, carry: false,
    sharpDogleg: 0.04, wind: [8, 25], firm: [0.08, 0.15],
  },
  desert: {
    name: 'Desert', fwHalf: [14, 21], roughW: [16, 28], wasteW: [15, 30], greenR: [12, 16],
    dogleg: 0.6, bend: 40, fwBunkers: [0, 2], fwBunkerR: [7, 11], potBunkers: false,
    gsBunkers: [1, 3], gsBunkerR: [5, 8], water: [0.3, 0.2], greenWater: [0.3, 0.2], sea: 0, carry: true,
    sharpDogleg: 0.07, wind: [2, 12], firm: [0.05, 0.1],
  },
  heathland: {
    name: 'Heathland', fwHalf: [15, 24], roughW: [8, 16], wasteW: [0, 0], greenR: [13, 18],
    dogleg: 0.55, bend: 40, fwBunkers: [1, 3], fwBunkerR: [9, 15], potBunkers: false, raggedBunkers: true,
    gsBunkers: [1, 3], gsBunkerR: [6, 10], water: [0.15, 0.1], greenWater: [0.1, 0.05], sea: 0, carry: false,
    sharpDogleg: 0.07, wind: [4, 16], firm: [0.05, 0.1],
  },
  alpine: {
    name: 'Alpine', fwHalf: [13, 22], roughW: [10, 20], wasteW: [0, 0], greenR: [12, 16],
    dogleg: 0.7, bend: 50, fwBunkers: [0, 2], fwBunkerR: [7, 11], potBunkers: false,
    gsBunkers: [1, 2], gsBunkerR: [5, 8], water: [0.3, 0.4], creekBias: true, greenWater: [0.15, 0.1], sea: 0, carry: false,
    sharpDogleg: 0.1, wind: [2, 14], firm: [0.02, 0.06], altitude: 1.1, yardage: 1.08, // thin air: the ball flies ~10% further
  },
  tropical: {
    name: 'Tropical', fwHalf: [15, 24], roughW: [12, 22], wasteW: [0, 0], greenR: [13, 18],
    dogleg: 0.55, bend: 40, fwBunkers: [1, 2], fwBunkerR: [8, 13], potBunkers: false,
    gsBunkers: [1, 3], gsBunkerR: [5, 9], water: [0.5, 0.45], greenWater: [0.4, 0.3], sea: 0.2, carry: false,
    sharpDogleg: 0.08, wind: [5, 15], firm: [0, 0.02],
  },
  woodland: {
    name: 'Woodland', fwHalf: [10, 16], roughW: [5, 10], wasteW: [0, 0], greenR: [11, 15],
    dogleg: 0.85, bend: 55, fwBunkers: [0, 1], fwBunkerR: [6, 10], potBunkers: false,
    gsBunkers: [1, 2], gsBunkerR: [5, 8], water: [0.25, 0.2], greenWater: [0.15, 0.1], sea: 0, carry: false,
    sharpDogleg: 0.12, wind: [0, 6], firm: [0, 0.03],
  },
  stadium: {
    name: 'Stadium', fwHalf: [14, 22], roughW: [10, 18], wasteW: [0, 0], greenR: [12, 17],
    dogleg: 0.6, bend: 45, fwBunkers: [1, 3], fwBunkerR: [8, 13], potBunkers: false,
    gsBunkers: [1, 3], gsBunkerR: [5, 9], water: [0.45, 0.35], greenWater: [0.45, 0.35], island: 0.4, sea: 0, carry: false,
    sharpDogleg: 0.25, wind: [3, 12], firm: [0.03, 0.08],
  },
};

// Tee boxes on every hole, from the back (black) forward. `cut` is roughly how
// much shorter the course plays from that set than from the black tees.
const TEE_SETS = [
  { key: 'black', name: 'Black', cut: 0, color: '#1c1c1c' },
  { key: 'blue', name: 'Blue', cut: 0.055, color: '#2f6fd6' },
  { key: 'white', name: 'White', cut: 0.12, color: '#f4f4f4' },
  { key: 'yellow', name: 'Yellow', cut: 0.19, color: '#f2c93a' },
];

// Steady pseudo-random number from a seed and an index, without touching any
// random stream (so adding tees didn't change any hole's layout).
const hash01 = (seed, k) => {
  let h = Math.imul(seed ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(k + 1, 0xc2b2ae35);
  h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
  return ((h ^ (h >>> 13)) >>> 0) / 4294967296;
};

// How far forward of the black tees each set sits on this hole, in yards.
function teeOffsets(par, length, seed) {
  const out = {};
  TEE_SETS.forEach((t, i) => {
    let off = length * t.cut * (0.6 + 0.8 * hash01(seed, i));
    off = Math.min(off, par === 3 ? Math.max(0, length - 100) : 150);
    out[t.key] = Math.round(off);
  });
  // Keep the sets in order: each one at or ahead of the one behind it.
  out.white = Math.max(out.white, out.blue + 5);
  out.yellow = Math.max(out.yellow, out.white + 5);
  return out;
}

const teeYards = (hole, tee = 'black') => hole.length - (hole.tees?.[tee] ?? 0);
const courseYards = (course, tee = 'black') => course.holes.reduce((t, h) => t + teeYards(h, tee), 0);

// Tee positions. Forward tees make local courses playable for beginners.
const LENGTH_SCALES = { forward: 0.82, short: 0.92, standard: 1, long: 1.05 };
const LENGTH_NAMES = { forward: 'Forward tees', short: 'Short', standard: 'Standard', long: 'Championship' };


// ---------- Hole and course generation ----------

const LENGTHS = { 3: [145, 235], 4: [355, 475], 5: [500, 600] };

function generateHole(seed, par, number = 1, styleKey = 'parkland', lengthScale = 1, signatures = true) {
  const st = STYLES[styleKey];
  const r = makeRng(seed);
  const rng = r;
  const length = Math.round(r.range(...LENGTHS[par]) * lengthScale);
  const tee = { x: 0, y: 0 };

  // Par 4s and 5s may dogleg at roughly driving distance.
  let pts;
  if (par === 3) {
    const ang = r.range(-0.12, 0.12);
    pts = [tee, { x: Math.sin(ang) * length, y: Math.cos(ang) * length }];
  } else {
    const bendS = Math.min(r.range(230, 285), length * 0.65); // short holes bend earlier
    const bendLat = r.chance(st.dogleg) ? r.range(-st.bend, st.bend) : r.range(-10, 10);
    const bend = { x: bendLat, y: bendS };
    const rest = length - Math.hypot(bendLat, bendS);
    const ang = r.range(-0.5, 0.5) * st.bend / 45;
    pts = [tee, bend, { x: bend.x + Math.sin(ang) * rest, y: bend.y + Math.cos(ang) * rest }];
  }
  // Signature holes: a sharp dogleg with the corner guarded, so the choice is
  // to lay up to the corner or shape a shot round it. Decided from its own
  // random stream, so ordinary holes are unchanged.
  const r3 = makeRng(seed ^ 0xd061e9);
  let corner = null;
  if (signatures && par > 3 && r3.chance(st.sharpDogleg ?? 0)) {
    const bendS = Math.min(r3.range(225, 260), length * 0.6);
    const turn = (r3.chance(0.5) ? 1 : -1) * r3.range(0.85, 1.3); // radians: about 50 to 75 degrees
    const bend = { x: 0, y: bendS };
    const rest = length - bendS;
    pts = [tee, bend, { x: bend.x + Math.sin(turn) * rest, y: bend.y + Math.cos(turn) * rest }];
    corner = { turn, bend, kind: (st.island || styleKey === 'tropical') && r3.chance(0.5) ? 'water' : 'trees', size: r3.range(28, 40) };
  }
  const line = buildLine(pts);
  const gEnd = pts[pts.length - 1];
  const green = makeBlob(r, gEnd.x, gEnd.y, r.range(...st.greenR), 0.16, [1, 1.35]);
  const pin = blobPoint(green, r.range(0, Math.PI * 2), r.range(0, 0.6));
  const phases = () => [r.range(0, 6.3), r.range(0, 6.3), r.range(0, 6.3)];
  const edges = { fl: phases(), fr: phases(), rl: phases(), rr: phases(), c: phases() };

  const fwHalf = r.range(...st.fwHalf);
  const roughW = r.range(...st.roughW);
  const wasteW = r.range(...st.wasteW);
  // Desert holes often need a carry over waste ground before the fairway starts.
  const fwStart = par === 3 ? Infinity : Math.min(st.carry ? r.range(170, 215) : 185, line.length * 0.4);
  const fwEnd = line.length - green.r * 0.5; // fairway runs up into the green

  const bunkers = [];
  const water = [];
  if (par > 3) {
    const n = r.int(...st.fwBunkers);
    for (let i = 0; i < n; i++) {
      const rad = r.range(...st.fwBunkerR);
      const side = r.chance(0.5) ? 1 : -1;
      // Links pot bunkers can sit right in the fairway; others line the edges.
      const lat = st.potBunkers && r.chance(0.5) ? r.range(-fwHalf, fwHalf) * 0.8 : side * (fwHalf + rad * r.range(0, 0.5));
      const c = pointAt(line, r.range(st.potBunkers ? 180 : 235, st.potBunkers ? 330 : 290), lat);
      addBunker(c, rad, false);
    }
  }
  // Bunkers are one to three overlapping lobes; links pot bunkers stay small and round.
  function addBunker(c, rad, greenside, r = rng) {
    const lobes = st.potBunkers ? 1 : r.int(1, st.raggedBunkers ? 4 : 3);
    const amp = st.potBunkers ? 0.08 : st.raggedBunkers ? 0.38 : 0.22;
    bunkers.push({ ...makeBlob(r, c.x, c.y, rad, amp, st.potBunkers ? [1, 1.15] : [1, 1.6]), greenside });
    for (let i = 1; i < lobes; i++) {
      const a = r.range(0, Math.PI * 2), off = rad * r.range(0.6, 0.9);
      bunkers.push({ ...makeBlob(r, c.x + Math.cos(a) * off, c.y + Math.sin(a) * off, rad * r.range(0.45, 0.75), 0.2), greenside });
    }
  }
  const ng = r.int(...st.gsBunkers);
  const back = line.segs[line.segs.length - 1];
  const baseAng = Math.atan2(-back.uy, -back.ux); // pointing from green back to tee
  for (let i = 0; i < ng; i++) {
    const rad = r.range(...st.gsBunkerR);
    const a = baseAng + r.range(-1.9, 1.9);
    const off = green.r + rad * 0.55;
    addBunker({ x: green.x + Math.cos(a) * off, y: green.y + Math.sin(a) * off }, rad, true);
  }

  let creek = null;
  if (r.chance(par === 3 ? st.water[0] : st.water[1])) {
    const kind = styleKey === 'links' ? (par === 3 ? 'front' : 'creek')
      : par === 3 ? 'front' : st.creekBias ? r.pick(['creek', 'creek', 'pond'])
      : r.pick(['pond', 'pond', 'front', par === 5 ? 'creek' : 'pond']);
    if (kind === 'pond') {
      const rad = r.range(18, 32);
      const side = r.chance(0.5) ? 1 : -1;
      const c = pointAt(line, r.range(200, line.length - 90), side * (fwHalf + rad * r.range(0.3, 0.8)));
      water.push(makeBlob(r, c.x, c.y, rad, 0.3, [1, 1.8]));
    } else if (kind === 'front') {
      const rad = r.range(12, 20) * (styleKey === 'links' ? 0.6 : 1);
      const c = pointAt(line, line.length - green.r - rad * 0.8 - r.range(2, 8), r.range(-8, 8));
      // Stretched across the line of play, so it guards the front of the green.
      water.push({ ...makeBlob(r, c.x, c.y, rad, 0.25, [1.3, 2], Math.atan2(back.uy, back.ux) + Math.PI / 2), front: true });
    } else {
      const s = r.range(Math.min(300, line.length - 160), line.length - 150);
      creek = { s: s, half: r.range(3, 6), meander: r.range(4, 10), ph: r.range(0, 6.3) };
    }
  }

  // Extra features use their own random stream, so adding them didn't reshape existing holes.
  const r2 = makeRng(seed ^ 0x5a5a5a);
  const toTee = Math.atan2(-back.uy, -back.ux);
  const guarded = water.length && kindFront(water);
  if (par === 3 && r2.chance(st.island ?? 0)) {
    // Island green: water all round, with the green sitting in the middle.
    water.push({ ...makeBlob(r2, green.x, green.y, green.r * r2.range(1.9, 2.4), 0.15, [1, 1.3]), greenside: true, island: true });
  } else if (!guarded && r2.chance(par === 3 ? st.greenWater[0] : st.greenWater[1])) {
    // A pond hugging part of the green: in front, or wrapping round one side.
    const lobes = r2.chance(0.25) ? 2 : 1;
    const a0 = toTee + r2.range(-1.4, 1.4);
    for (let i = 0; i < lobes; i++) {
      const a = a0 + i * (r2.chance(0.5) ? 1 : -1) * r2.range(0.9, 1.3);
      const rad = green.r * r2.range(0.9, 1.3);
      const d = green.r * 0.85 + rad * 0.7;
      water.push({ ...makeBlob(r2, green.x + Math.cos(a) * d, green.y + Math.sin(a) * d, rad, 0.25, [1, 1.5], a + Math.PI / 2), greenside: true });
    }
  }
  // More fairway bunkers: around the drive landing zone, and the lay-up zone on par 5s.
  if (par > 3) {
    const zones = [[Math.min(215, line.length * 0.6), Math.min(300, line.length * 0.8)], ...(par === 5 ? [[line.length - 170, line.length - 90]] : [])];
    for (const [s0, s1] of zones) {
      const n = r2.int(1, st.potBunkers ? 3 : 2);
      for (let i = 0; i < n; i++) {
        const rad = r2.range(...st.fwBunkerR);
        const side = r2.chance(0.5) ? 1 : -1;
        const lat = st.potBunkers && r2.chance(0.5) ? r2.range(-fwHalf, fwHalf) * 0.8 : side * (fwHalf + rad * r2.range(-0.3, 0.4));
        addBunker(pointAt(line, r2.range(s0, s1), lat), rad, false, r2);
      }
    }
  }
  // Links holes beside the sea: beach then open water down one side.
  const sea = r2.chance(st.sea) ? { side: r2.chance(0.5) ? 1 : -1, beach: r2.range(5, 12), ph: [r2.range(0, 6.3), r2.range(0, 6.3), r2.range(0, 6.3)] } : null;

  // Guard the inside of a sharp dogleg with a stand of tall trees or a lake.
  const copses = [];
  if (corner) {
    // pointAt's positive offset is to the left of the first leg, so a right turn's inside is negative.
    const inward = corner.turn > 0 ? -1 : 1;
    const inside = pointAt(line, corner.bend.y - corner.size * 1.5, inward * (fwHalf * 0.5 + corner.size * 1.25));
    const blob = makeBlob(r3, inside.x, inside.y, corner.size, 0.25, [1, 1.4]);
    if (corner.kind === 'water') water.push(blob); else copses.push(blob);
  }

  const hole = {
    number, par, length, seed, style: styleKey, line, tee, green, pin, fwHalf, roughW, wasteW, fwStart, fwEnd, edges, sea,
    bunkers, water, creek, copses, signature: !!corner,
    bearing: r.range(0, Math.PI * 2), // compass direction the hole plays, for wind
    altitude: st.altitude ?? 1,
  };
  hole.tees = teeOffsets(par, length, seed);
  if (water.some((w) => w.island)) hole.bridge = islandBridge(hole, toTee + (seed % 2 ? 1.1 : -1.1));
  return hole;
}

// A footbridge from an island green to dry land, heading off at angle `a`.
// Worked out from the layout alone (no random numbers), and only drawn: a ball
// landing on it still counts as in the water.
function islandBridge(hole, a) {
  const at = (t) => ({ x: hole.green.x + Math.cos(a) * t, y: hole.green.y + Math.sin(a) * t });
  let t = 0;
  while (t < 60 && blobGap(hole.green, at(t)) <= 0) t += 0.5;
  const from = at(t - 1);
  while (t < 90 && surfaceAt(hole, at(t)) === 'water') t += 0.5;
  return { from, to: at(t + 2), width: 2.5 };
}

const kindFront = (water) => water.some((w) => w.front);

// Pars for 18 holes: always four par 3s; par 5s make up the rest of the total.
// Below par 68, short courses swap par 4s for extra par 3s.
function parList(total) {

// Lays the 18 holes of a course out on one shared map, like Sim Golf: each tee

const STEP = 10;      // yards per cell of the layout map

// The layout for a course: { places: [{ x, y, rot }], coast, inland }, with a place per

// q.x * u.x + q.y * u.y > c, and every hole stays on the land side of it, the

function courseMap(course) {

  if (cache.has(id)) return cache.get(id);

// The shaped ground for one hole, sampled every GROUND_STEP yards; built the
// first time it's needed and kept for a while, as the same course gets built
// again for each hole.
const grids = new Map();
function groundGrid(hole) {
  const t = hole.terrain;
  const id = `${hole.style}:${hole.seed}:${hole.number}:${t.seed}:${t.place.x}:${t.place.y}:${t.place.rot}:${!!hole.sea}`;
  if (hole.groundGrid?.id === id) return hole.groundGrid;
  if (grids.has(id)) return (hole.groundGrid = grids.get(id));
  const b = holeBounds(hole, 12);
  const x0 = b.minX, y0 = b.minY;
  const nx = Math.ceil((b.maxX - x0) / GROUND_STEP) + 1, ny = Math.ceil((b.maxY - y0) / GROUND_STEP) + 1;
  const n = nx * ny;
  const hills = new Float32Array(n), target = new Float32Array(n), weight = new Float32Array(n);
  const surf = new Array(n);
  const at = (i, j) => ({ x: x0 + i * GROUND_STEP, y: y0 + j * GROUND_STEP });
  const map = (p) => toMap(t.place, p);
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      const k = j * nx + i, p = at(i, j);
      hills[k] = hillsAt(t, map(p));
      surf[k] = surfaceAt(hole, p, true);
    }
  }

  // A green tilts one way, the way the hills fall, but gently.
  const gc = { x: hole.green.x, y: hole.green.y };
  const g0 = hillsAt(t, map(gc));
  let gx = (hillsAt(t, map({ x: gc.x + 4, y: gc.y })) - hillsAt(t, map({ x: gc.x - 4, y: gc.y }))) / 8;
  let gy = (hillsAt(t, map({ x: gc.x, y: gc.y + 4 })) - hillsAt(t, map({ x: gc.x, y: gc.y - 4 }))) / 8;
  const tilt = Math.hypot(gx, gy) || 1, want = Math.max(GREEN_TILT[0], Math.min(GREEN_TILT[1], tilt));
  if (tilt < 1e-6) gx = 1;
  gx *= want / tilt; gy *= want / tilt;
  // Tees are flat at the height of the ground where they are.
  const teeAt = (p) => {
    let best = Infinity, h = 0;
    for (const s of Object.values(hole.tees ?? {})) {
      const q = pointAt(hole.line, s), d = Math.hypot(p.x - q.x, p.y - q.y);
      if (d < best) { best = d; h = hillsAt(t, map(q)); }
    }
    return h;
  };
  // A lake lies flat at the lowest ground it covers, so the land banks up round it.
  const lakes = hole.water.map(() => Infinity);
  for (let k = 0; k < n; k++) {
    if (surf[k] !== 'water') continue;
    const p = at(k % nx, Math.floor(k / nx));
    hole.water.forEach((w, wi) => { if (blobGap(w, p) <= 0) lakes[wi] = Math.min(lakes[wi], hills[k]); });
  }

  const hard = new Uint8Array(n); // ground that keeps its own height right to its edge
  for (let k = 0; k < n; k++) {
    const p = at(k % nx, Math.floor(k / nx)), s = surf[k];
    if (s === 'green' || s === 'fringe') { target[k] = g0 + 0.4 + gx * (p.x - gc.x) + gy * (p.y - gc.y); weight[k] = 1; }
    else if (s === 'tee') { target[k] = teeAt(p) + 0.4; weight[k] = 1; }
    else if (s === 'fairway') { target[k] = hillsAt(t, map(p), true); weight[k] = 0.8; }
    else if (s === 'water') {
      const wi = hole.water.findIndex((w) => blobGap(w, p) <= 0);
      target[k] = (wi >= 0 ? lakes[wi] : hills[k]) - 1; weight[k] = 1; hard[k] = 1; // creeks run in a cut
    } else if (s === 'sea') { target[k] = 0; weight[k] = 1; hard[k] = 1; }
    else if (s === 'beach') { target[k] = 0.6; weight[k] = 1; }
    else if (s === 'bunker') hard[k] = 1;
  }

  // Blend the shaping into the hills round it.
  const tw = boxBlur(target.map((v, k) => v * weight[k]), nx, ny, BLEND);
  const wb = boxBlur(weight, nx, ny, BLEND);
  const h = new Float32Array(n);
  for (let k = 0; k < n; k++) {
    const w = Math.min(1, wb[k]);
    h[k] = wb[k] > 1e-4 ? hills[k] * (1 - w) + (tw[k] / wb[k]) * w : hills[k];
    if (hard[k] || surf[k] === 'green' || surf[k] === 'tee') h[k] = surf[k] === 'bunker' ? h[k] - 0.5 : target[k]; // bunkers are dug in
  }
  const grid = { id, x0, y0, nx, ny, h };
  if (grids.size > 60) grids.delete(grids.keys().next().value);
  grids.set(id, grid);
  return (hole.groundGrid = grid);
}

function boxBlur(src, nx, ny, r) {
  const a = new Float32Array(src.length), out = new Float32Array(src.length);
  for (let j = 0; j < ny; j++) {
    let sum = 0;
    for (let i = -r; i <= r; i++) sum += src[j * nx + Math.max(0, Math.min(nx - 1, i))];
    for (let i = 0; i < nx; i++) {
      a[j * nx + i] = sum / (2 * r + 1);
      sum += src[j * nx + Math.min(nx - 1, i + r + 1)] - src[j * nx + Math.max(0, i - r)];
    }
  }
  for (let i = 0; i < nx; i++) {
    let sum = 0;
    for (let j = -r; j <= r; j++) sum += a[Math.max(0, Math.min(ny - 1, j)) * nx + i];
    for (let j = 0; j < ny; j++) {
      out[j * nx + i] = sum / (2 * r + 1);
      sum += a[Math.min(ny - 1, j + r + 1) * nx + i] - a[Math.max(0, j - r) * nx + i];
    }
  }
  return out;
}

// Height of the ground at point p on a hole, in yards. Flat if the hole has no terrain.
function heightAt(hole, p) {
  const t = hole.terrain;
  if (!t) return 0;
  const g = groundGrid(hole);
  const fx = (p.x - g.x0) / GROUND_STEP, fy = (p.y - g.y0) / GROUND_STEP;
  if (fx < 0 || fy < 0 || fx > g.nx - 1 || fy > g.ny - 1) return hillsAt(t, toMap(t.place, p));
  const i = Math.min(g.nx - 2, Math.floor(fx)), j = Math.min(g.ny - 2, Math.floor(fy));
  const u = fx - i, v = fy - j, k = j * g.nx + i;
  const { h } = g;
  return h[k] * (1 - u) * (1 - v) + h[k + 1] * u * (1 - v) + h[k + g.nx] * (1 - u) * v + h[k + g.nx + 1] * u * v;
}

// Which way and how steeply the ground rises at p: { x, y } in yards up per yard across.
function slopeAt(hole, p, d = 1) {
  return {
    x: (heightAt(hole, { x: p.x + d, y: p.y }) - heightAt(hole, { x: p.x - d, y: p.y })) / (2 * d),
    y: (heightAt(hole, { x: p.x, y: p.y + d }) - heightAt(hole, { x: p.x, y: p.y - d })) / (2 * d),
  };
}

// How much higher (+) or lower (-) `to` is than `from`, in yards.
const rise = (hole, from, to) => heightAt(hole, to) - heightAt(hole, from);

// ---- course.js ----
// The game's take on the generator: more doglegs and more hazards than the
// management game, so shaping a shot round a corner or away from trouble pays.
// The generator itself is untouched. The tweaks below only change probabilities
// and sizes, never how many random numbers it draws, so every hole keeps its
// overall shape; the extra hazards come from their own random stream.


for (const st of Object.values(STYLES)) {
  st.dogleg = Math.min(0.95, st.dogleg + 0.2);
  st.bend = Math.round(st.bend * 1.2);
  st.sharpDogleg = Math.min(0.5, (st.sharpDogleg ?? 0) * 2.5);
}

// Like the generator's blobs: a circle with a wobbly edge, stretched and turned.
function blob(r, x, y, R, amp = 0.22, stretch = [1, 1.5]) {
  const h = [];
  let left = amp;
  for (let k = 2; k <= 4 && left > 0.01; k++) {
    const a = k === 4 ? left : r.range(0.3, 0.7) * left;
    h.push([k, a, r.range(0, Math.PI * 2)]);
    left -= a;
  }
  return { x, y, r: R, rot: r.range(0, Math.PI), sx: r.range(...stretch), h };
}

// Pass { layout: false } to skip laying the holes out on the course map (quicker, for stats).
function buildCourse(def, { layout = true } = {}) {
  const course = generateCourse(def);
  for (const hole of course.holes) addHazards(hole);
  // Lay the course out; a seaside hole with no room on the coast loses its sea.
  if (layout) for (const n of courseMap(course).inland) course.holes[n].sea = null;
  // Hills and slopes, from where each hole sits on the map.
  const map = layout ? courseMap(course) : null;
  course.holes.forEach((hole, n) => { hole.terrain = terrainFor(course, map ? map.places[n] : { x: 0, y: 0, rot: 0 }, map?.coast ?? null); });
  return course;
}

function addHazards(hole) {
  const st = STYLES[hole.style];
  const r = makeRng(hole.seed ^ 0x4a7a2d);
  const wet = st.water[1] + 0.15; // how often a style picks water over sand
  const clearOfGreen = (p, rad) => blobGap(hole.green, p) > rad + 3;
  const add = (p, rad, water) => {
    if (!clearOfGreen(p, rad)) return;
    if (water) hole.water.push(blob(r, p.x, p.y, rad, 0.28, [1, 1.7]));
    else hole.bunkers.push({ ...blob(r, p.x, p.y, rad, st.potBunkers ? 0.08 : 0.24, st.potBunkers ? [1, 1.15] : [1, 1.6]), greenside: false });
  };
  const bunkerR = () => r.range(...st.fwBunkerR) * 1.1;

  if (hole.par === 3) {
    // A second guard on the other side of the green, so the shape of the shot in matters.
    if (r.chance(0.6)) {
      const a = r.range(0, Math.PI * 2), rad = r.range(...st.gsBunkerR);
      const d = hole.green.r + rad * 0.7;
      add({ x: hole.green.x + Math.cos(a) * d, y: hole.green.y + Math.sin(a) * d }, rad, false);
    }
    return;
  }

  const pts = hole.line.points;
  const seg0 = hole.line.segs[0], seg1 = hole.line.segs[1];
  const turn = seg1 ? seg0.ux * seg1.uy - seg0.uy * seg1.ux : 0; // > 0 turns left
  if (Math.abs(turn) > 0.12) {
    // Dogleg: trouble on the inside to punish cutting the corner, and a bunker
    // straight through the corner to catch a shot that doesn't turn.
    const inside = turn > 0 ? 1 : -1; // pointAt's positive offset is to the left
    const bendS = seg0.len;
    const rad = r.range(12, 20);
    add(pointAt(hole.line, bendS - rad * 0.8, inside * (hole.fwHalf + rad * 0.5)), rad, r.chance(wet));
    const through = r.range(18, 32), rad2 = bunkerR();
    add({ x: pts[1].x + seg0.ux * through, y: pts[1].y + seg0.uy * through }, rad2, false);
  } else {
    // Straight hole: hazards either side of the driving zone, staggered, so the
    // safe line favours one shape over the other.
    const side = r.chance(0.5) ? 1 : -1;
    const s1 = Math.min(r.range(215, 250), hole.line.length * 0.6);
    const rad = r.range(10, 18);
    add(pointAt(hole.line, s1, side * (hole.fwHalf + rad * 0.4)), rad, r.chance(wet));
    add(pointAt(hole.line, s1 + r.range(20, 40), -side * (hole.fwHalf + 2)), bunkerR(), false);
  }
  // Par 5s get something to think about on the lay-up too.
  if (hole.par === 5) {
    const s = hole.line.length - r.range(90, 130);
    const p = pointAt(hole.line, s, (r.chance(0.5) ? 1 : -1) * hole.fwHalf * r.range(0.2, 0.9));
    if (dist(p, hole.green) > hole.green.r + 25) add(p, bunkerR(), r.chance(wet * 0.6));
  }
}

// ---- art.js ----
// Pixel art drawn from code: ground colours, sprites and a tiny bitmap font,
// plus the trees, course props and ground textures from assets/trees,
// assets/props and assets/ground (packed into tree-assets.js, prop-assets.js
// and ground-assets.js).


const hex = (s) => {
  const n = parseInt(s.slice(1), 16);
  // ImageData is little-endian RGBA, so pack as ABGR.
  return (0xff << 24 | (n & 0xff) << 16 | (n & 0xff00) | n >> 16) >>> 0;
};

// Ground colours. Each surface has a base and an alternate (stripes or speckles),
// and some have an edge colour for lips and banks.
const BASE_GROUND = {
  land: ['#5aa236', '#559c33'],
  trees: ['#2f6a22', '#2b6320'],
  copse: ['#285e1d', '#24561a'],
  rough: ['#468c2c', '#4c932f'],
  fairway: ['#78c848', '#6aba40'],
  fringe: ['#7acc4c', '#76c84a'],
  green: ['#8cdc5a', '#84d454'],
  tee: ['#80d250', '#76c64a'],
  bunker: ['#ecdca4', '#d9c68a', '#b39e64'],
  water: ['#3a7fd0', '#79b4f0', '#2a5c9c'],
  sea: ['#2f6bb8', '#5d97dc', '#24548f'],
  beach: ['#f0e2b0', '#e2cf96', '#c8b47a'],
  waste: ['#d8b878', '#b89a5c', '#a88a4c'],
};

// Style tweaks: what grows off the fairway and which trees line the hole.
// A name listed more than once turns up more often. `density` is the chance of
// a tree on each tile of woods.
const LEAFY = ['oak-1', 'oak-2', 'oak-3', 'oak-4', 'oak-5', 'oak-6', 'oak-7', 'bushy-1', 'bushy-2'];
const PINES = ['pine-1', 'pine-2', 'pine-3', 'pine-4', 'pine-5', 'pine-6', 'pine-7', 'pine-8', 'pine-9', 'pine-10'];
const STYLE_ART = {

  stadium: { trees: [...LEAFY, 'cypress-1', 'cypress-2', 'cypress-2', 'bush-1'], density: 0.18 },
  woodland: { trees: [...LEAFY, ...LEAFY, ...PINES, ...PINES, 'autumn-1', 'autumn-2', 'autumn-3', 'bare-1', 'bare-2', 'willow'], density: 0.26 },

// Ground colours for a style, as packed pixels: { surface: [base, alt, edge] }.
function groundPalette(style) {
  const g = { ...BASE_GROUND, ...(STYLE_ART[style]?.ground ?? {}) };
  const out = {};
  for (const k in g) {
    const [a, b, e] = g[k];
    out[k] = [hex(a), hex(b), hex(e ?? darken(a))];
  }
  return out;
}

// Ground textures for a style, as packed pixels: { surface: { w, h, px } }.
// The textures are drawn in parkland colours. A style with its own colour for a
// surface keeps the texture's light and dark but takes its colour from the style.
const textureCache = new Map();
function groundTextures(style) {
  if (textureCache.has(style)) return textureCache.get(style);
  const own = { ...BASE_GROUND, ...(STYLE_ART[style]?.ground ?? {}) };
  const out = {};
  for (const [name, [w, h, b64]] of Object.entries(GROUND_PIXELS)) {
    const bytes = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
    const n = w * h;
    const lum = (k) => 0.3 * bytes[k * 4] + 0.59 * bytes[k * 4 + 1] + 0.11 * bytes[k * 4 + 2];
    let mean = 0;
    for (let k = 0; k < n; k++) mean += lum(k) / n;
    const recolour = own[name][0] !== BASE_GROUND[name][0];
    const to = parseInt(own[name][0].slice(1), 16), base = [to >> 16, (to >> 8) & 255, to & 255];
    const px = new Uint32Array(n);
    for (let k = 0; k < n; k++) {
      const f = lum(k) / mean;
      const [r, g, b] = recolour ? base.map((v) => Math.min(255, Math.round(v * f))) : [0, 1, 2].map((i) => bytes[k * 4 + i]);
      px[k] = (0xff << 24 | b << 16 | g << 8 | r) >>> 0;
    }
    out[name] = { w, h, px };
  }
  textureCache.set(style, out);
  return out;
}

function darken(c) {
  const n = parseInt(c.slice(1), 16);
  const f = (v) => Math.round(v * 0.72).toString(16).padStart(2, '0');
  return '#' + f(n >> 16) + f((n >> 8) & 0xff) + f(n & 0xff);
}

// ---------- Sprites ----------
// Each sprite is rows of characters; '.' is transparent and other letters index
// its colours. (ax, ay) is the pixel that sits on the ground point.

const SPRITES = {
  golfer: {
    ax: 2, ay: 9, colors: { h: '#f4f4f4', s: '#e8b88a', c: '#d03a2a', p: '#2a2a3a', k: '#1a3a12' },
    rows: [
      '.hhh.',
      '.hhh.',
      '..s..',
      '.ccc.',
      'c.c.c',
      's.c.s',
      '.p.p.',
      '.p.p.',
      '.p.p.',
      'kk.kk',
    ],
  },
};

// Turn sprite rows into packed pixels once, with colours resolved.
for (const s of Object.values(SPRITES)) {
  s.w = s.rows[0].length;
  s.h = s.rows.length;
  s.px = s.rows.map((r) => [...r].map((ch) => (ch === '.' ? 0 : hex(s.colors[ch]))));
}

// The trees and props, anchored at the foot: the middle of the bottom row.
// Props have a soft shadow below them, which isn't drawn, so theirs is the
// lowest solid row; a flag's is the hole, under its pole.
for (const [name, [w, h, b64]] of Object.entries({ ...TREE_PIXELS, ...PROP_PIXELS })) {
  const bytes = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
  const px = [];
  for (let j = 0; j < h; j++) {
    const row = [];
    for (let i = 0; i < w; i++) {
      const k = (j * w + i) * 4;
      row.push(bytes[k + 3] < 128 ? 0 : (0xff << 24 | bytes[k + 2] << 16 | bytes[k + 1] << 8 | bytes[k]) >>> 0);
    }
    px.push(row);
  }
  let ay = h - 1;
  while (ay > 0 && !px[ay].some((c) => c)) ay--;
  const foot = px[ay].map((c, i) => (c ? i : -1)).filter((i) => i >= 0);
  let ax = foot.length ? Math.round((foot[0] + foot[foot.length - 1]) / 2) : w >> 1;
  if (name.startsWith('flag-')) {
    ax = Math.min(...px.slice(0, h >> 1).map((row) => row.findIndex((c) => c)).filter((i) => i >= 0));
    ay = h - 3; // the hole: every flag frame is cut the same height
  }
  SPRITES[name] = { w, h, px, ax, ay };
}

// Draw a sprite into a packed pixel buffer with its anchor at (x, y).
function blit(buf, W, H, sprite, x, y, tint = null) {
  const x0 = Math.round(x) - sprite.ax, y0 = Math.round(y) - sprite.ay;
  for (let j = 0; j < sprite.h; j++) {
    const yy = y0 + j;
    if (yy < 0 || yy >= H) continue;
    for (let i = 0; i < sprite.w; i++) {
      const xx = x0 + i;
      const c = sprite.px[j][i];
      if (!c || xx < 0 || xx >= W) continue;
      buf[yy * W + xx] = tint?.[c] ?? c;
    }
  }
}

// Swap colours on a sprite, e.g. a different shirt for each golfer.
const recolor = (sprite, map) => {
  const out = {};
  for (const k in map) out[hex(sprite.colors[k])] = hex(map[k]);
  return out;
};


// A sprite as a small canvas, for drawing things that move over the hole.
const spriteCache = new Map();
function spriteImage(name, recolors = {}) {
  const key = name + JSON.stringify(recolors);
  if (!spriteCache.has(key)) {
    const s = SPRITES[name];
    const c = document.createElement('canvas');
    c.width = s.w; c.height = s.h;
    const g = c.getContext('2d');
    const img = g.createImageData(s.w, s.h);
    const tint = recolor(s, recolors);
    blit(new Uint32Array(img.data.buffer), s.w, s.h, s, s.ax, s.ay, tint);
    g.putImageData(img, 0, 0);
    spriteCache.set(key, c);
  }
  return spriteCache.get(key);
}

function drawSprite(ctx, name, x, y, recolors) {
  const s = SPRITES[name];
  ctx.drawImage(spriteImage(name, recolors), Math.round(x) - s.ax, Math.round(y) - s.ay);
}

// ---------- Font ----------
// 3x5 pixel font. Each glyph is 15 bits, read left to right, top to bottom.

const GLYPHS = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110',
  E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101',
  I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
  M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100',
  Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
  Y: '101101010010010', Z: '111001010100111',
  0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110',
  4: '101101111001001', 5: '111100110001110', 6: '011100111101111', 7: '111001010010010',
  8: '111101111101111', 9: '111101111001110',
  ':': '000010000010000', '.': '000000000000010', '-': '000000111000000', '/': '001001010100100',
  '(': '010100100100010', ')': '010001001001010', "'": '010010000000000', '%': '101001010100101',
  '+': '000010111010000', '!': '010010010000010', '?': '110001010000010', ',': '000000000010100', ' ': '000000000000000',
};

const textWidth = (s, scale = 1) => (s.length * 4 - 1) * scale;

// Draw text on a 2D canvas context, with a one-pixel shadow so it reads on any ground.
function drawText(ctx, s, x, y, color = '#f4f4f4', scale = 1, shadow = '#1a1a2a') {
  const pass = (dx, dy, col) => {
    ctx.fillStyle = col;
    let cx = x;
    for (const ch of s.toUpperCase()) {
      const g = GLYPHS[ch] ?? GLYPHS['?'];
      for (let k = 0; k < 15; k++) {
        if (g[k] === '1') ctx.fillRect(cx + (k % 3) * scale + dx, y + Math.floor(k / 3) * scale + dy, scale, scale);
      }
      cx += 4 * scale;
    }
  };
  if (shadow) pass(scale, scale, shadow);
  pass(0, 0, color);
}

// ---- dinky.js ----
// Sprites from the Dinky Tiny Golf pack by Mike Moore (www.pixelbitsnbytes.com):
// a few result banners. Also the golfer and
// the score and hazard pop-ups, from Dave's sheets. Until the images have
// loaded, callers fall back to the placeholder art.


// Every golfer frame is cut the same size, with the middle of the feet here.
const GOLFER_FEET = { x: 20, y: 36 };

const images = {};
for (const [name, url] of Object.entries({ ...DINKY_PNGS, ...GOLFER_PNGS, ...POPUP_PNGS })) {
  const img = new Image();
  img.src = url;
  images[name] = img;
}

const ready = (name) => images[name]?.complete && images[name].naturalWidth > 0;

// How to find each look's shirt in its frames (its colour as drawn on the
// sheet), and how light each shirt pixel is, to keep the shading when it's
// recoloured, and optionally the row it stops at; null for a look whose shirt
// can't be recoloured.
const SHIRTS = {
  club: { is: (r, g, b) => b >= r + 25 && b >= g + 15, light: (r, g, b) => (r + g + b) / 3 / 120 }, // blue
  heavy: { is: (r, g, b) => r >= g + 90 && Math.abs(g - b) < 35, light: (r) => r / 190 },          // red
  athletic: { is: (r, g, b) => r >= g + 70 && b >= g + 30, light: (r) => r / 190 },                // pink
  casual: { is: (r, g, b) => b >= r + 15 && b >= g + 50, light: (r, g, b) => b / 230, above: 33 }, // lilac (her shoes too, so only above row 33)
  tall: { is: (r, g, b) => g >= r + 40 && g >= b + 20, light: (r, g) => g / 150 },               // green
  veteran: null, // a beige jumper, too like the trousers and skin to pick out: keeps his own colours
};
// Every golfer look there are sprites for.
const GOLFER_LOOKS = Object.keys(SHIRTS);

// A sprite as a canvas, with a golfer's shirt recoloured to `shirt` (a
// '#rrggbb' colour, or null to keep it), and its anchor: the middle of its
// feet (or the foot of the flag pole).
const preparedCache = new Map();
function prepared(name, shirt = null) {
  const key = `${name}|${shirt}`;
  if (preparedCache.has(key)) return preparedCache.get(key);
  if (!ready(name)) return null;
  const img = images[name];
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  const data = g.getImageData(0, 0, c.width, c.height);
  const px = data.data;
  const look = SHIRTS[name.split('/')[0]];
  if (shirt && look) {
    const n = parseInt(shirt.slice(1), 16), sr = n >> 16, sg = (n >> 8) & 255, sb = n & 255;
    for (let i = 0; i < px.length; i += 4) {
      const [r, gg, b] = [px[i], px[i + 1], px[i + 2]];
      if (px[i + 3] === 0 || !look.is(r, gg, b) || i / 4 / c.width >= (look.above ?? Infinity)) continue;
      const light = look.light(r, gg, b);
      px[i] = Math.min(255, sr * light); px[i + 1] = Math.min(255, sg * light); px[i + 2] = Math.min(255, sb * light);
    }
    g.putImageData(data, 0, 0);
  }
  // Anchor at the middle of the lowest row that has anything in it.
  let ax = 0, ay = c.height;

// The golfer's frame for a pose. `t` is how far through the stroke they are,
// counting the swing up to the moment of impact as 1 (it goes on past 1 while
// the ball flies), and `now` (in ms) moves the idle and mood frames along.
//   'swing': the full swing, then the follow through, holding the finish and
//            shading the eyes to watch the ball;
//   'putt':  the putting stroke;
//   'address': over the ball, about to play;
//   'joy', 'cry': after holing out, with `now` counted from when they holed;
//   'stand': waiting a turn, shifting about.

// a quick strike.
const SWING_FRAMES = [['address', 0.16], ['takeaway', 0.34], ['backswing-1', 0.52], ['backswing-2', 0.76], ['downswing-1', 0.86], ['downswing-2', 0.94], ['impact', 1]];

    if (t < 1.6) return FOLLOW_FRAMES[Math.floor((t - 1) / 0.2)];
    return t < 4 ? 'finish' : 'shade-eyes';

  if (pose === 'cry') return `cross-${1 + Math.min(3, Math.floor(now / 350) % 6)}`;
  return IDLE_FRAMES[Math.floor(now / 450) % IDLE_FRAMES.length];
}

// The ball in the air gets bigger the higher it is.
const ballFrame = (h) => `ball-${h < 12 ? 1 : h < 30 ? 2 : 3}`;

// The flag's frame, waving; `plain` without the ring round the hole.
const flagFrame = (now, plain = false) => `flag-${plain ? 'plain-' : ''}${1 + (Math.floor(now / 160) % 4)}`;

// Result banners: which picture goes with a lie after a shot, or a score on a hole.
const LIE_BANNERS = { fairway: 'txt-fairway', rough: 'txt-intherough', bunker: 'pop-bunker', green: 'txt-onthegreen' };

// ---- iso.js ----
// Isometric projection for a hole grid from holeToGrid.
// Each grid square is drawn as a diamond TW x TH pixels. Unturned, rows are
// flipped so the tee sits towards the bottom left of the screen and the green
// towards the top right; the view can turn round the hole a quarter at a time.

const TW = 8, TH = 4;

// Yards of height to pixels up the screen, on a grid of `cell`-yard tiles.
const liftPx = (h, cell) => h / cell * TH * 1.5;

// Screen axes (u, v) for a tile (col, row), and back, for each quarter turn.
// u runs down to the right on screen and v down to the left, so tiles with a
// bigger u + v are nearer the viewer.
const QUARTER_TURNS = [
  [(c, r, C, R) => [c, R - r], (u, v, C, R) => [u, R - v]],
  [(c, r, C, R) => [R - r, C - c], (u, v, C, R) => [C - v, R - u]],
  [(c, r, C, R) => [C - c, r], (u, v, C, R) => [C - u, v]],
  [(c, r) => [r, c], (u, v) => [v, u]],
];

// A view places a grid on the screen, turned `turn` quarter turns (0 to 3).
// (ox, oy) is where the centre of the tile at u = v = 0 lands, in screen pixels.
// `ground(p)` is the height of the ground in yards at world point p (flat if left out).
function makeView(grid, ox, oy, ground = () => 0, turn = 0) {
  const { rows, cols, cell, originX, originY } = grid;
  const [uv, cr] = QUARTER_TURNS[turn & 3];
  const toUV = (col, row) => uv(col, row, cols - 1, rows - 1);
  const fromUV = (u, v) => { const [col, row] = cr(u, v, cols - 1, rows - 1); return { col, row }; };

  // Fractional tile position to screen pixels (tile centres are whole numbers).
  const uvToScreen = (u, v) => ({ x: ox + (u - v) * TW / 2, y: oy + (u + v) * TH / 2 });
  const tileToScreen = (col, row) => uvToScreen(...toUV(col, row));
  // Screen pixels to fractional tile position; round both to get the tile under a pixel.
  const screenToUV = (x, y) => {
    const a = (x - ox) / (TW / 2), b = (y - oy) / (TH / 2);
    return [(a + b) / 2, (b - a) / 2];
  };
  const screenToTile = (x, y) => fromUV(...screenToUV(x, y));
  // World yards (as used by the generator) to screen pixels, on the ground or
  // at height z yards.
  const flatToScreen = (p) => tileToScreen((p.x - originX) / cell - 0.5, (p.y - originY) / cell - 0.5);
  const worldToScreen = (p, z = ground(p)) => {
    const s = flatToScreen(p);
    s.y -= liftPx(z, cell);
    return s;
  };
  // Screen pixels to world yards, on the ground: look a little further down the
  // screen for ground that's raised up to this pixel.
  const flatToWorld = (x, y) => {
    const t = screenToTile(x, y);
    return { x: originX + (t.col + 0.5) * cell, y: originY + (t.row + 0.5) * cell };
  };
  const screenToWorld = (x, y) => {
    let p = flatToWorld(x, y);
    for (let k = 0; k < 6; k++) p = flatToWorld(x, y + liftPx(ground(p), cell));
    return p;
  };
  // A direction in world yards to a screen direction, in pixels per yard.
  const worldDirToScreen = (dx, dy) => {
    const a = tileToScreen(0, 0), b = tileToScreen(dx / cell, dy / cell);
    return { x: b.x - a.x, y: b.y - a.y };
  };

  return { grid, ox, oy, ground, turn: turn & 3, toUV, fromUV, uvToScreen, screenToUV, tileToScreen, screenToTile, worldToScreen, screenToWorld, worldDirToScreen };
}

// Place a grid so its playable part (everything that isn't the tree margin) is
// centred in the box { x, y, w, h }, with the ground raised by `ground`.
// Returns the view and whether it fitted.
function fitView(grid, box, ground = () => 0, turn = 0) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const probe = makeView(grid, 0, 0, ground, turn);
  for (let row = 0; row < grid.rows; row++) {
    for (let col = 0; col < grid.cols; col++) {
      if (grid.tiles[row][col] === 'trees') continue;
      const s = probe.tileToScreen(col, row);
      s.y -= liftPx(ground(grid.toWorld(col, row)), grid.cell);
      minX = Math.min(minX, s.x - TW / 2); maxX = Math.max(maxX, s.x + TW / 2);
      minY = Math.min(minY, s.y - TH / 2); maxY = Math.max(maxY, s.y + TH / 2);
    }
  }
  const ox = Math.round(box.x + box.w / 2 - (minX + maxX) / 2);
  const oy = Math.round(box.y + box.h / 2 - (minY + maxY) / 2);
  return { view: makeView(grid, ox, oy, ground, turn), fits: maxX - minX <= box.w && maxY - minY <= box.h };
}

// ---- weather.js ----
// Weather for a round, and the wind as it blows across a particular hole.


// Same course and round number always give the same weather.
const roundWeather = (course, round = 1) => drawWeather(course, makeRng((course.seed ^ 0x77e1a5) + round));

// Wind in the hole's own frame, in mph: `along` is towards the green (negative is
// into the golfer's face) and `across` is left to right as the golfer looks down the hole.
function holeWind(weather, hole) {
  const a = weather.windDir - hole.bearing;
  return { along: weather.windMph * Math.cos(a), across: weather.windMph * Math.sin(a) };
}

// Plain words for the HUD, e.g. "HELPING, LEFT TO RIGHT".
function windWords(w) {
  if (Math.hypot(w.along, w.across) < 1) return 'CALM';
  const parts = [];
  if (Math.abs(w.along) >= 2) parts.push(w.along > 0 ? 'HELPING' : 'AGAINST');
  if (Math.abs(w.across) >= 2) parts.push(w.across > 0 ? 'LEFT TO RIGHT' : 'RIGHT TO LEFT');
  return parts.join(', ') || 'LIGHT';
}

// ---- hole-view.js ----

// Yards per tile, most detailed first. The first one that fits the screen is used.
const CELLS = [3, 4, 5, 6, 8];
