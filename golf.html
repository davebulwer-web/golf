// ---- dinky.js ----
// Sprites from the Dinky Tiny Golf pack by Mike Moore (www.pixelbitsnbytes.com):
// the golfer, the ball in flight, the flag and the result banners. Until the
// images have loaded, callers fall back to the placeholder art.


const images = {};
for (const [name, url] of Object.entries(DINKY_PNGS)) {
  const img = new Image();
  img.src = url;
  images[name] = img;
}

const ready = (name) => images[name]?.complete && images[name].naturalWidth > 0;

// A sprite as a canvas, with the golfer's blue shirt recoloured to `shirt`
// (a '#rrggbb' colour, or null to keep it), and its anchor: the middle of its
// feet (or the foot of the flag pole).
const preparedCache = new Map();
function prepared(name, shirt = null) {
  const key = `${name}|${shirt}`;
  if (preparedCache.has(key)) return preparedCache.get(key);
  if (!ready(name)) return null;
  const img = images[name];
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  const data = g.getImageData(0, 0, c.width, c.height);
  const px = data.data;
  if (shirt) {
    const n = parseInt(shirt.slice(1), 16), sr = n >> 16, sg = (n >> 8) & 255, sb = n & 255;
    for (let i = 0; i < px.length; i += 4) {
      const [r, gg, b] = [px[i], px[i + 1], px[i + 2]];
      if (px[i + 3] === 0 || b < r + 60 || b < gg + 30) continue; // only the strong blues of the shirt
      const light = (r + gg + b) / 3 / 120; // keep its shading
      px[i] = Math.min(255, sr * light); px[i + 1] = Math.min(255, sg * light); px[i + 2] = Math.min(255, sb * light);
    }
    g.putImageData(data, 0, 0);
  }
  // Anchor at the middle of the lowest row that has anything in it.
  let ax = 0, ay = c.height;
  for (let y = c.height - 1; y >= 0; y--) {
    const xs = [];
    for (let x = 0; x < c.width; x++) if (px[(y * c.width + x) * 4 + 3] > 0) xs.push(x);
    if (xs.length) { ax = name.startsWith('flag') ? xs[0] : Math.round((xs[0] + xs[xs.length - 1]) / 2); ay = y; break; }
  }
  const out = { canvas: c, ax, ay, w: c.width, h: c.height };
  preparedCache.set(key, out);
  return out;
}

// Draw sprite `name` with its anchor at (x, y), or with `topLeft` its top left
// corner. Returns false if it isn't loaded yet.
function drawDinky(ctx, name, x, y, shirt = null, topLeft = false) {
  const s = prepared(name, shirt);
  if (!s) return false;
  ctx.drawImage(s.canvas, Math.round(topLeft ? x : x - s.ax), Math.round(topLeft ? y : y - s.ay));
  return true;
}

// Size of a sprite (for centring banners), or null if not loaded.
function dinkySize(name) {
  const s = prepared(name);
  return s && { w: s.w, h: s.h };
}

// The golfer's frame for a pose: 'stand', 'swing' (with t from 0 to 1 through
// the swing), 'joy' or 'cry' (with now in ms, to flick between frames).
function golferFrame(pose, t = 0, now = 0) {
  if (pose === 'swing') return `swing${Math.min(5, 1 + Math.floor(t * 5))}`;
  if (pose === 'joy' || pose === 'cry') return `${pose}${1 + (Math.floor(now / 260) % 2)}`;
  return 'swing1';
}

// The ball gets bigger the higher it is, from 'ball0' on the ground.
const ballFrame = (h) => `ball${Math.max(0, Math.min(4, Math.round(h / 9)))}`;

// The flag's frame, waving.
const flagFrame = (now) => `flag${1 + (Math.floor(now / 160) % 4)}`;

// Result banners: which picture goes with a lie after a shot, or a score on a hole.
const LIE_BANNERS = { fairway: 'txt-fairway', rough: 'txt-intherough', bunker: 'txt-bunker', green: 'txt-onthegreen' };
function scoreBanner(strokes, par) {
  if (strokes === 1) return ['txt-holeinone'];
  const d = strokes - par;
  return d <= -2 ? ['txt-eagle'] : d === -1 ? ['txt-birdie'] : d === 0 ? ['txt-par'] : d === 1 ? ['txt-bogey'] : d === 2 ? ['txt-double', 'txt-bogey'] : [];
}

// ---- iso.js ----
// Isometric projection for a hole grid from holeToGrid.
// Each grid square is drawn as a diamond TW x TH pixels. Rows are flipped so the
// tee sits towards the bottom left of the screen and the green towards the top right.

const TW = 8, TH = 4;

// A view places a grid on the screen. (ox, oy) is where the centre of tile
// col 0, flipped row 0 lands, in screen pixels.
function makeView(grid, ox, oy) {
  const { rows, cell, originX, originY } = grid;
  const flip = (row) => rows - 1 - row;

  // Fractional tile position to screen pixels (tile centres are whole numbers).
  const tileToScreen = (col, row) => {
    const rp = flip(row);
    return { x: ox + (col - rp) * TW / 2, y: oy + (col + rp) * TH / 2 };
  };
  // Screen pixels to fractional tile position; round both to get the tile under a pixel.
  const screenToTile = (x, y) => {
    const u = (x - ox) / (TW / 2), v = (y - oy) / (TH / 2);
    return { col: (u + v) / 2, row: flip((v - u) / 2) };
  };
  // World yards (as used by the generator) to screen pixels.
  const worldToScreen = (p) => tileToScreen((p.x - originX) / cell - 0.5, (p.y - originY) / cell - 0.5);
  // Screen pixels to world yards, on the ground.
  const screenToWorld = (x, y) => {
    const t = screenToTile(x, y);
    return { x: originX + (t.col + 0.5) * cell, y: originY + (t.row + 0.5) * cell };
  };
  // A direction in world yards to a screen direction, in pixels per yard.
  const worldDirToScreen = (dx, dy) => ({ x: (dx + dy) / cell * TW / 2, y: (dx - dy) / cell * TH / 2 });

  return { grid, ox, oy, tileToScreen, screenToTile, worldToScreen, screenToWorld, worldDirToScreen };
}

// Place a grid so its playable part (everything that isn't the tree margin) is
// centred in the box { x, y, w, h }. Returns the view and whether it fitted.
function fitView(grid, box) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const probe = makeView(grid, 0, 0);
  for (let row = 0; row < grid.rows; row++) {
    for (let col = 0; col < grid.cols; col++) {
      if (grid.tiles[row][col] === 'trees') continue;
      const s = probe.tileToScreen(col, row);
      minX = Math.min(minX, s.x - TW / 2); maxX = Math.max(maxX, s.x + TW / 2);
      minY = Math.min(minY, s.y - TH / 2); maxY = Math.max(maxY, s.y + TH / 2);
    }
  }
  const ox = Math.round(box.x + box.w / 2 - (minX + maxX) / 2);
  const oy = Math.round(box.y + box.h / 2 - (minY + maxY) / 2);
  return { view: makeView(grid, ox, oy), fits: maxX - minX <= box.w && maxY - minY <= box.h };
}

// ---- weather.js ----
// Weather for a round, and the wind as it blows across a particular hole.


// Same course and round number always give the same weather.
const roundWeather = (course, round = 1) => drawWeather(course, makeRng((course.seed ^ 0x77e1a5) + round));

// Wind in the hole's own frame, in mph: `along` is towards the green (negative is
// into the golfer's face) and `across` is left to right as the golfer looks down the hole.
function holeWind(weather, hole) {
  const a = weather.windDir - hole.bearing;
  return { along: weather.windMph * Math.cos(a), across: weather.windMph * Math.sin(a) };
}

// Plain words for the HUD, e.g. "HELPING, LEFT TO RIGHT".
function windWords(w) {
  if (Math.hypot(w.along, w.across) < 1) return 'CALM';
  const parts = [];
  if (Math.abs(w.along) >= 2) parts.push(w.along > 0 ? 'HELPING' : 'AGAINST');
  if (Math.abs(w.across) >= 2) parts.push(w.across > 0 ? 'LEFT TO RIGHT' : 'RIGHT TO LEFT');
  return parts.join(', ') || 'LIGHT';
}

// ---- hole-view.js ----
// Draws a whole hole as isometric pixel art into a packed pixel buffer.


// Yards per tile, most detailed first. The first one that fits the screen is used.
const CELLS = [3, 4, 5, 6, 8];

// Surfaces that sit below the grass (drawn with a lip on their far edge) and
// above it (drawn with a bank on their near edge).
const SUNKEN = new Set(['bunker', 'water', 'sea']);
const RAISED = new Set(['green', 'tee']);

// Steady noise from integer coordinates, in [0, 1).
const hash = (a, b, k = 0) => {
  let h = Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(k, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1103515245);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};

// Pick the most detailed grid whose playable area fits in `box`.
function layoutHole(hole, box) {
  let best;
  for (const cell of CELLS) {
    best = fitView(holeToGrid(hole, { cell }), box);
    if (best.fits) break;
  }
  const { rows, cols, tiles } = best.view.grid;
  best.view.own = thinTrees({ c0: 0, r0: 0, rows, cols, tiles }, best.view.grid.cell);
  best.view.look = best.view.own;
  best.view.others = [];
  return best.view;
}

// The same view moved by (dx, dy) pixels, e.g. to draw into a bigger image with a margin.
function shiftView(view, dx, dy) {
  return { ...makeView(view.grid, view.ox + dx, view.oy + dy), own: view.own, look: view.look, others: view.others };
}

// What to draw at tile (col, row): a surface, or 'land' for open grass.
const lookAt = (look, c, r) => look.tiles[r - look.r0]?.[c - look.c0] ?? 'land';

// Beyond this hole's own band of woods is out of bounds, other holes included.
function isOutOfBounds(view, p) {
  const t = view.grid.toTile(p);
  return lookAt(view.own, t.col, t.row) === 'land';
}

// Fill in everything around the hole that shows in a W x H image: the other
// holes of the course nearby (from the course map) and, on links, the open sea.
function addSurroundings(view, course, index, W, H) {
  const { grid } = view;
  const hole = course.holes[index];
  const others = neighbours(course, index);
  const { places, coast } = courseMap(course);
  const ownBounds = holeBounds(hole, 0);
  const corners = [[0, 0], [W, 0], [0, H + 16], [W, H + 16]].map(([x, y]) => view.screenToTile(x, y));
  const c0 = Math.floor(Math.min(...corners.map((t) => t.col))) - 1, c1 = Math.ceil(Math.max(...corners.map((t) => t.col))) + 1;
  const r0 = Math.floor(Math.min(...corners.map((t) => t.row))) - 1, r1 = Math.ceil(Math.max(...corners.map((t) => t.row))) + 1;
  const tiles = [];
  const own = { ...view.own, tiles: view.own.tiles.map((row) => row.slice()) };
  for (let r = r0; r <= r1; r++) {
    const row = new Array(c1 - c0 + 1);
    for (let c = c0; c <= c1; c++) {
      const s = view.tileToScreen(c, r);
      let t = 'trees';
      if (s.x < -TILE_PAD || s.x > W + TILE_PAD || s.y < -TILE_PAD || s.y > H + 3 * TILE_PAD) t = 'land';
      else {
        const mine = grid.tiles[r]?.[c];
        const p = grid.toWorld(c, r);
        if (mine && mine !== 'trees') t = mine;
        else if (!mine && hole.sea && p.x > ownBounds.minX && p.x < ownBounds.maxX && p.y > ownBounds.minY && p.y < ownBounds.maxY) {
          const here = surfaceAt(hole, p, true);
          if (here === 'sea' || here === 'beach') t = here;
        }
        if (t === 'trees') {
          for (const o of others) {
            const q = o.toThere(p), b = o.bounds;
            if (q.x < b.minX || q.x > b.maxX || q.y < b.minY || q.y > b.maxY) continue;
            const there = surfaceAt(o.hole, q, true);
            if (there !== 'trees') {
              t = there;
              break;
            }
          }
        }
        if (t === 'trees') t = coastAt(coast, toMap(places[index], p)) ?? 'trees';
        // Other holes and the open sea are out of bounds.
        if (t !== 'trees' && (!mine || mine === 'trees') && own.tiles[r - own.r0]?.[c - own.c0]) own.tiles[r - own.r0][c - own.c0] = 'land';
      }
      row[c - c0] = t;
    }
    tiles.push(row);
  }
  view.look = thinTrees({ c0, r0, rows: tiles.length, cols: c1 - c0 + 1, tiles }, grid.cell);
  view.others = others;
  view.own = own;
}
const TILE_PAD = 24;

// The generator fills everything outside the rough with trees. For drawing, keep
// a ragged band of woods along the hole and open grass beyond it (still trees for play).
const WOODS_YARDS = 22;
// `area` is { c0, r0, rows, cols, tiles } with tiles[r - r0][c - c0].
function thinTrees(area, cell) {
  const { c0, r0, rows, cols, tiles } = area;
  const far = new Int16Array(rows * cols).fill(-1);
  const queue = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (tiles[r][c] !== 'trees' && tiles[r][c] !== 'land') { far[r * cols + c] = 0; queue.push(r * cols + c); }
    }
  }
  for (let q = 0; q < queue.length; q++) {
    const k = queue[q], r = Math.floor(k / cols), c = k % cols;
    for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const rr = r + dr, cc = c + dc, kk = rr * cols + cc;
      if (rr < 0 || rr >= rows || cc < 0 || cc >= cols || far[kk] >= 0) continue;
      far[kk] = far[k] + 1;
      queue.push(kk);
    }
  }
  const out = tiles.map((row, r) => row.map((t, c) => {
    const depth = (WOODS_YARDS * (0.6 + 0.8 * hash((c + c0) >> 1, (r + r0) >> 1, 21))) / cell;
    return t === 'trees' && (far[r * cols + c] < 0 || far[r * cols + c] > depth) ? 'land' : t;
  }));
  return { c0, r0, rows, cols, tiles: out };
}

// The surface under every screen pixel, plus its tile, for texturing.
function sampleGround(view, W, H) {
  const names = [];
  const ids = new Map();
  const id = (s) => {
    if (!ids.has(s)) { ids.set(s, names.length); names.push(s); }
    return ids.get(s);
  };
  const surf = new Uint8Array(W * H);
  const tc = new Int16Array(W * H), tr = new Int16Array(W * H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const t = view.screenToTile(x + 0.5, y + 0.5);
      const c = Math.round(t.col), r = Math.round(t.row);
      const k = y * W + x;
      surf[k] = id(lookAt(view.look, c, r));
      tc[k] = c; tr[k] = r;
    }
  }
  return { names, surf, tc, tr };
}

function paintGround(buf, W, H, style, g) {
  const pal = groundPalette(style);
  const { names, surf, tc, tr } = g;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const k = y * W + x;
      const s = names[surf[k]];
      const [base, alt, edge] = pal[s] ?? pal.land;
      let c = base;
      switch (s) {
        case 'fairway': c = (tr[k] >> 1) & 1 ? alt : base; break; // mowing stripes across the hole
        case 'green': case 'tee': c = tr[k] & 1 ? alt : base; break;
        case 'water': case 'sea': c = hash(x >> 2, y, 7) < 0.05 ? alt : base; break; // ripples
        case 'bunker': case 'beach': case 'waste': c = hash(x, y, 3) < 0.14 ? alt : base; break;
        case 'fringe': break;
        default: c = hash(x, y, 1) < 0.28 ? alt : base; // grassy speckle
      }
      // Lips on the far side of bunkers and water, banks on the near side of greens and tees.
      if (SUNKEN.has(s) && y > 0 && surf[k - W] !== surf[k] && !SUNKEN.has(names[surf[k - W]])) c = edge;
      if (RAISED.has(s) && y < H - 1 && names[surf[k + W]] !== s) c = edge;
      buf[k] = c;
    }
  }
}

// Trees, bushes and cacti, sorted back to front.
function paintScenery(buf, W, H, view, style) {
  const art = STYLE_ART[style] ?? STYLE_ART.parkland;
  // Range of tiles that can show on screen, with room for tall sprites below the edge.
  const corners = [[0, 0], [W, 0], [0, H + 16], [W, H + 16]].map(([x, y]) => view.screenToTile(x, y));
  const c0 = Math.floor(Math.min(...corners.map((t) => t.col))), c1 = Math.ceil(Math.max(...corners.map((t) => t.col)));
  const r0 = Math.floor(Math.min(...corners.map((t) => t.row))), r1 = Math.ceil(Math.max(...corners.map((t) => t.row)));

  const items = [];
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      const s = lookAt(view.look, c, r);
      const density = s === 'trees' ? art.density : s === 'copse' ? 0.85 : s === 'land' ? landDensity(art, c, r) : 0;
      if (!density || hash(c, r, 11) >= density) continue;
      const p = view.tileToScreen(c, r);
      const kind = art.trees[Math.floor(hash(c, r, 12) * art.trees.length)];
      const x = p.x + Math.round((hash(c, r, 13) - 0.5) * 4), y = p.y + Math.round((hash(c, r, 14) - 0.5) * 2);
      if (x < -10 || x > W + 10 || y < -2 || y > H + 16) continue;
      items.push({ sprite: SPRITES[kind], x, y });
    }
  }
  items.sort((a, b) => a.y - b.y || a.x - b.x);
  for (const it of items) blit(buf, W, H, it.sprite, it.x, it.y);
}

// Out on the open grass, trees grow in scattered clumps.
const landDensity = (art, c, r) => art.density * (hash(c >> 3, r >> 3, 31) < 0.3 ? 0.45 : 0.015);

// Tee markers and anything standing on the hole, e.g. golfers and balls.
function paintMarkers(buf, W, H, view, hole, actors) {
  const items = [];
  for (const t of TEE_SETS) {
    const at = view.worldToScreen(pointAt(hole.line, hole.tees[t.key]));
    const col = hex(t.color), dark = hex('#1a1a1a');
    for (const dx of [-3, 3]) items.push({ y: at.y, draw: () => { put(buf, W, H, at.x + dx, at.y, col); put(buf, W, H, at.x + dx, at.y + 1, dark); } });
  }
  // The flags are drawn over the top each frame, so they can wave.
  for (const a of actors) {
    const p = view.worldToScreen(a.at);
    if (a.ball) items.push({ y: p.y, draw: () => put(buf, W, H, p.x, p.y, hex('#ffffff')) });
    if (a.golfer) {
      const tint = recolor(SPRITES.golfer, { c: a.shirt });
      items.push({ y: p.y, draw: () => blit(buf, W, H, SPRITES.golfer, p.x - 3, p.y, tint) });
    }
  }
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.draw();
}

function put(buf, W, H, x, y, c) {
  x = Math.round(x); y = Math.round(y);
  if (x >= 0 && x < W && y >= 0 && y < H) buf[y * W + x] = c;
}

// Draw the hole into ImageData-sized buffer `buf` (Uint32Array of W x H).
// `actors` are things on the hole: { at: {x, y} in yards, golfer, ball, shirt }.
function drawHole(buf, W, H, hole, view, actors = []) {
  const ground = sampleGround(view, W, H);
  paintGround(buf, W, H, hole.style, ground);
  paintScenery(buf, W, H, view, hole.style);
  if (view.others.length) shadeOutOfBounds(buf, W, H, view, ground);
  paintMarkers(buf, W, H, view, hole, actors);
}

// Darken everything out of bounds a little, so the hole being played stands out
// from its neighbours. The sea is left alone: it has its own edge.
function shadeOutOfBounds(buf, W, H, view, g) {
  const open = new Set(['sea', 'beach'].map((s) => g.names.indexOf(s)));
  for (let k = 0; k < W * H; k++) {
    if (open.has(g.surf[k]) || lookAt(view.own, g.tc[k], g.tr[k]) !== 'land') continue;
    const c = buf[k];
    const r = (c & 255) * 0.8, gr = ((c >>> 8) & 255) * 0.8, b = ((c >>> 16) & 255) * 0.82;
    buf[k] = (c & 0xff000000) | (b << 16) | (gr << 8) | r;
  }
}

// ---- hud.js ----
// On-screen panels: hole details and the wind, drawn over the hole.


const PANEL = 'rgba(40, 28, 70, 0.82)', EDGE = '#9a86d8', GOLD = '#f2c93a';

function panel(ctx, x, y, w, h) {
  ctx.fillStyle = PANEL;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = EDGE;
  ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
}

// `wind` is from holeWind; `windScreen` is the same wind as a screen direction.
// `standing` is the round so far, e.g. '+2 THRU 3'.
function drawHud(ctx, W, H, { course, hole, tee, weather, wind, windScreen, standing }) {
  // Hole card, top left.
  const title = `HOLE ${hole.number}`;
  const line2 = `PAR ${hole.par}  ${teeYards(hole, tee)} YDS`;
  const line3 = `${course.name}  ${STYLES[course.style].name}`;
  const keys = 'N/P HOLE  R COURSE  S STYLE  +/- ZOOM';
  const w = Math.max(textWidth(title, 2) + (standing ? textWidth(standing) + 8 : 0), textWidth(line2), textWidth(line3), textWidth(keys)) + 12;
  panel(ctx, 6, 6, w, 42);
  drawText(ctx, title, 12, 11, GOLD, 2);
  if (standing) drawText(ctx, standing, 12 + textWidth(title, 2) + 8, 15, '#ffffff');
  drawText(ctx, line2, 12, 24);
  drawText(ctx, line3, 12, 31, '#c8c0e8');
  drawText(ctx, keys, 12, 39, '#8a80b0', 1, null);

  // Wind, top right: an arrow showing where it blows on screen, and its strength.
  const words = windWords(wind);
  const ww = Math.max(textWidth(words), 56) + 12, wx = W - ww - 6;
  panel(ctx, wx, 6, ww, 34);
  drawText(ctx, 'WIND', wx + 6, 11, GOLD);
  drawText(ctx, `${weather.windMph} MPH`, wx + 6, 18);
  drawText(ctx, words, wx + 6, 31, '#c8c0e8');
  const cx = wx + ww - 14, cy = 18;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
  for (let a = 0; a < 32; a++) ctx.fillRect(Math.round(cx + Math.cos(a / 5.1) * 8), Math.round(cy + Math.sin(a / 5.1) * 4), 1, 1);
  if (weather.windMph >= 1) arrow(ctx, cx, cy, windScreen, 8, '#f4f4f4');

}

// A pixel arrow from (x, y) along screen direction `d`, `len` pixels long.
function arrow(ctx, x, y, d, len, color) {
  const n = Math.hypot(d.x, d.y) || 1, ux = d.x / n, uy = d.y / n;
  ctx.fillStyle = color;
  const dot = (px, py) => ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
  for (let t = -len / 2; t <= len / 2; t += 0.5) dot(x + ux * t, y + uy * t);
  const tx = x + ux * len / 2, ty = y + uy * len / 2;
  for (const side of [-1, 1]) {
    for (let t = 0; t <= 3; t += 0.5) dot(tx - ux * t + -uy * side * t * 0.8, ty - uy * t + ux * side * t * 0.8);
  }
}

// ---------- Shot bar ----------

const BAR_H = 46;
const BAR_TOP = (H) => H - BAR_H - 4;

// Where each shot button sits, for drawing and for clicks.
const shotButtons = (H, count) => Array.from({ length: count }, (_, i) => ({ x: 12 + i * 46, y: BAR_TOP(H) + 6, w: 42, h: 34 }));

// Little side-on pictures of each shot's flight, like Sim Golf's shot buttons.
const ICONS = {
  straight: (t) => ({ x: t * 28, y: 10 * Math.sin(Math.PI * t) }),
  fade: (t) => ({ x: t * 28, y: 10 * Math.sin(Math.PI * t ** 1.5) }),
  draw: (t) => ({ x: t * 30, y: 8 * Math.sin(Math.PI * t ** 0.65) }),
  lob: (t) => ({ x: 6 + t * 16, y: 13 * Math.sin(Math.PI * t) }),
  runner: (t) => ({ x: t * 30, y: t < 0.6 ? 4 * Math.sin(Math.PI * t / 0.6) : 0 }),
};

// The hit and cancel buttons at the right of the bar.
const actionButtons = (W, H) => ({
  hit: { x: W - 12 - 64, y: BAR_TOP(H) + 6, w: 64, h: 34 },
  cancel: { x: W - 12 - 64 - 6 - 48, y: BAR_TOP(H) + 6, w: 48, h: 34 },
});

function button(ctx, b, label, sub, on, color) {
  ctx.fillStyle = on ? color : '#2c2050';
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = on ? GOLD : '#5a4a90';
  ctx.fillRect(b.x, b.y, b.w, 1); ctx.fillRect(b.x, b.y + b.h - 1, b.w, 1);
  ctx.fillRect(b.x, b.y, 1, b.h); ctx.fillRect(b.x + b.w - 1, b.y, 1, b.h);
  const scale = textWidth(label, 2) <= b.w - 8 ? 2 : 1;
  drawText(ctx, label, b.x + Math.round((b.w - textWidth(label, scale)) / 2), b.y + 8, on ? '#ffffff' : '#6a5a98', scale, on ? '#1a1a2a' : null);
  drawText(ctx, sub, b.x + Math.round((b.w - textWidth(sub)) / 2), b.y + 25, on ? '#e8e4f8' : '#6a5a98', 1, null);
}

// `info`: { types, selected, club, aim, max, lie, toPin, stroke, hint, canHit }
function drawShotBar(ctx, W, H, info) {
  const top = BAR_TOP(H);
  panel(ctx, 6, top, W - 12, BAR_H);
  shotButtons(H, info.types.length).forEach((b, i) => {
    const t = info.types[i], on = t.key === info.selected;
    ctx.fillStyle = on ? '#6a56b8' : '#2c2050';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = on ? GOLD : '#5a4a90';
    ctx.fillRect(b.x, b.y, b.w, 1); ctx.fillRect(b.x, b.y + b.h - 1, b.w, 1);
    ctx.fillRect(b.x, b.y, 1, b.h); ctx.fillRect(b.x + b.w - 1, b.y, 1, b.h);
    ctx.fillStyle = on ? '#ffffff' : '#c8c0e8';
    for (let k = 0; k <= 40; k++) {
      const p = ICONS[t.key](k / 40);
      ctx.fillRect(Math.round(b.x + 6 + p.x), Math.round(b.y + 20 - p.y), 1, 1);
    }
    ctx.fillStyle = '#7a9a4a';
    ctx.fillRect(b.x + 4, b.y + 21, b.w - 8, 1);
    drawText(ctx, `${i + 1} ${t.name}`, b.x + Math.round((b.w - textWidth(`${i + 1} ${t.name}`)) / 2), b.y + 25, on ? '#ffffff' : '#c8c0e8', 1, null);
  });

  const x = 12 + info.types.length * 46 + 10;
  drawText(ctx, `CLUB: ${info.club}`, x, top + 8, GOLD);
  drawText(ctx, info.aim ? `AIM: ${info.aim} YDS  (MAX ${info.max})` : `MAX: ${info.max} YDS`, x, top + 17);
  drawText(ctx, `LIE: ${info.lie}`, x, top + 26);
  drawText(ctx, `TO PIN: ${info.toPin} YDS   STROKE ${info.stroke}`, x, top + 35);
  const act = actionButtons(W, H);
  button(ctx, act.cancel, 'CANCEL', 'ESC', info.canHit, '#7a3a4a');
  button(ctx, act.hit, 'HIT', 'SPACE', info.canHit, '#3a8a3a');
  if (info.hint) drawText(ctx, info.hint, act.cancel.x - 10 - textWidth(info.hint), top + 35, '#c8c0e8');
}

// A banner across the middle top, for things like "IN THE WATER".
function drawBanner(ctx, W, text, sub) {
  const w = Math.max(textWidth(text, 2), sub ? textWidth(sub) : 0) + 20;
  const x = Math.round((W - w) / 2);
  panel(ctx, x, 54, w, sub ? 30 : 20);
  drawText(ctx, text, Math.round((W - textWidth(text, 2)) / 2), 59, GOLD, 2);
  if (sub) drawText(ctx, sub, Math.round((W - textWidth(sub)) / 2), 74);
}

// ---------- Scorecard ----------

const sum = (a) => a.reduce((t, v) => t + (v ?? 0), 0);
const toParText = (d) => (d === 0 ? 'E' : d > 0 ? `+${d}` : `${d}`);

// Medal play card: each golfer's score on each hole against par, front nine,
// back nine and total.
function drawScorecard(ctx, W, H, round, holeNumber, title) {
  const n = round.players.length;
  const COL = 14, LABEL = 34, ROW = 10, blockH = (2 + n) * ROW + 4;
  const w = LABEL + 9 * COL + 26 + 12, h = 18 + 2 * blockH + 10 + n * 10 + 24;
  const x0 = Math.round((W - w) / 2), y0 = Math.round((H - h) / 2) - 10;
  panel(ctx, x0, y0, w, h);
  drawText(ctx, title, x0 + Math.round((w - textWidth(title)) / 2), y0 + 6, GOLD);

  const block = (from, label, y) => {
    const xs = (i) => x0 + 6 + LABEL + i * COL;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.fillRect(x0 + 6, y - 2, w - 12, 9);
    drawText(ctx, 'HOLE', x0 + 6, y, '#c8c0e8', 1, null);
    drawText(ctx, 'PAR', x0 + 6, y + ROW, '#c8c0e8', 1, null);
    round.players.forEach((p, r) => drawText(ctx, p.name, x0 + 6, y + (2 + r) * ROW, p.label ?? p.shirt, 1, null));
    for (let i = 0; i < 9; i++) {
      const hn = from + i, cx = xs(i), mid = (s) => cx + Math.round((COL - textWidth(s)) / 2);
      if (hn + 1 === holeNumber) { ctx.fillStyle = 'rgba(242, 201, 58, 0.25)'; ctx.fillRect(cx, y - 2, COL - 1, (2 + n) * ROW - 1); }
      drawText(ctx, `${hn + 1}`, mid(`${hn + 1}`), y, '#ffffff', 1, null);
      drawText(ctx, `${round.pars[hn]}`, mid(`${round.pars[hn]}`), y + ROW, '#c8c0e8', 1, null);
      round.players.forEach((p, r) => {
        const sc = p.scores[hn];
        if (sc == null) return;
        const d = sc - round.pars[hn];
        drawText(ctx, `${sc}`, mid(`${sc}`), y + (2 + r) * ROW, d < 0 ? GOLD : d > 0 ? '#f08a8a' : '#ffffff', 1, null);
      });
    }
    const tx = xs(9) + 4;
    drawText(ctx, label, tx, y, '#ffffff', 1, null);
    drawText(ctx, `${sum(round.pars.slice(from, from + 9))}`, tx, y + ROW, '#c8c0e8', 1, null);
    round.players.forEach((p, r) => {
      const part = p.scores.slice(from, from + 9);
      if (part.some((sc) => sc != null)) drawText(ctx, `${sum(part)}`, tx, y + (2 + r) * ROW, '#ffffff', 1, null);
    });
  };
  block(0, 'OUT', y0 + 18);
  block(9, 'IN', y0 + 18 + blockH);

  let ty = y0 + 18 + 2 * blockH + 6;
  round.players.forEach((p) => {
    const played = p.scores.map((sc, i) => (sc == null ? null : sc - round.pars[i])).filter((d) => d != null);
    const line = played.length ? `${p.name}: ${sum(p.scores)}  (${toParText(sum(played))} THRU ${played.length})` : `${p.name}: NO HOLES YET`;
    drawText(ctx, line, x0 + Math.round((w - textWidth(line)) / 2), ty, GOLD);
    ty += 10;
  });
  const y1 = ty;
  const help = 'TAB: SHOW OR HIDE CARD';
  drawText(ctx, help, x0 + Math.round((w - textWidth(help)) / 2), y1 + 2, '#8a80b0', 1, null);
  const credit = 'SPRITES: MIKE MOORE, PIXELBITSNBYTES.COM';
  drawText(ctx, credit, x0 + Math.round((w - textWidth(credit)) / 2), y1 + 10, '#6a6090', 1, null);
}

// ---- golfers.js ----
// Golfers and their skills. Skills run 0 to 100.
//   power      how far they can hit it
//   accuracy   how tight full shots land around the aim
//   shortGame  the same for lobs, chips and anything inside 100 yards
//   recovery   how well they play from rough, sand, waste and trees
//   putting    how often putts drop
// Computer golfers also have `nerve` (0 to 1): how much risk they'll take for a better spot.

const PLAYER = {
  name: 'You', shirt: '#d03a2a',
  skills: { power: 55, accuracy: 55, shortGame: 55, recovery: 50, putting: 55 },
};

const RIVAL = {
  name: 'Bertie', shirt: '#2f6fd6', ai: true, nerve: 0.5,
  skills: { power: 60, accuracy: 52, shortGame: 55, recovery: 55, putting: 50 },
};

// ---- shots.js ----
// The five shots, how far each can go, and what actually happens when one is hit.
// Distances are yards. The player aims where the ball should land; skills and
// luck decide how close it gets, then it rolls out.


// reach: share of a full shot's carry. curve: +1 bends right, -1 bends left.
// apex: how high it flies. roll: share of the carry it rolls on firm grass.
// wind: how much the wind moves it. spread: how wide it scatters.
const SHOT_TYPES = [
  { key: 'straight', name: 'Normal', reach: 1, curve: 0, apex: 1, roll: 0.12, wind: 1, spread: 1 },
  { key: 'fade', name: 'Fade', reach: 0.95, curve: 1, apex: 1.1, roll: 0.07, wind: 1, spread: 0.85 },
  { key: 'draw', name: 'Draw', reach: 1.02, curve: -1, apex: 0.9, roll: 0.18, wind: 1, spread: 1.1 },
  { key: 'lob', name: 'Lob', reach: 0.45, curve: 0, apex: 2.2, roll: 0.03, wind: 1.3, spread: 1 },
  { key: 'runner', name: 'Runner', reach: 0.8, curve: 0, apex: 0.35, roll: 0.35, wind: 0.5, spread: 0.9 },
];
const shotType = (key) => SHOT_TYPES.find((t) => t.key === key);

// How a lie cuts distance and widens the scatter, before the recovery skill helps.
const LIE_REACH = { tee: 1, fairway: 0.97, fringe: 0.9, green: 0.6, rough: 0.82, waste: 0.82, bunker: 0.55, trees: 0.45 };
const LIE_SPREAD = { tee: 1, fairway: 1, fringe: 1.05, green: 1.2, rough: 1.35, waste: 1.3, bunker: 1.6, trees: 2 };
// How far the ball rolls on landing, as a share of the shot's normal roll.
const ROLL = { green: 1, fairway: 1, tee: 0.9, fringe: 0.8, waste: 0.4, rough: 0.25, trees: 0.1, bunker: 0, water: 0 };
const HARD_LIES = new Set(['rough', 'waste', 'bunker', 'trees']);

const fullCarry = (golfer) => 190 + 0.9 * golfer.skills.power;

function lieReach(golfer, type, lie) {
  // A low runner is the way out of the trees.
  const base = lie === 'trees' && type.key === 'runner' ? 0.7 : LIE_REACH[lie] ?? 1;
  return base + (1 - base) * 0.3 * golfer.skills.recovery / 100;
}

// Furthest the golfer can carry this shot from this lie.
const maxCarry = (golfer, type, lie, hole) => fullCarry(golfer) * type.reach * lieReach(golfer, type, lie) * (hole.altitude ?? 1);

// Clubs and their carry for an average golfer; scaled by each golfer's power.
const CLUBS = [
  ['Driver', 235], ['3 Wood', 215], ['5 Wood', 200], ['4 Iron', 185], ['5 Iron', 175], ['6 Iron', 165],
  ['7 Iron', 155], ['8 Iron', 145], ['9 Iron', 133], ['Pitching Wedge', 120], ['Gap Wedge', 105], ['Sand Wedge', 90], ['Lob Wedge', 70],
];

// The club for a shot, picked automatically from the distance.
function chooseClub(golfer, type, carry, lie) {
  const scale = fullCarry(golfer) / 235;
  if (type.key === 'lob') return carry > 70 * scale || lie === 'bunker' ? 'Sand Wedge' : 'Lob Wedge';
  if (lie === 'bunker' && carry < 90 * scale) return 'Sand Wedge';
  // A runner is played with less loft, so a longer club for the same carry.
  const need = carry * (type.key === 'runner' ? 1.25 : 1);
  const usable = CLUBS.filter(([name]) => name !== 'Driver' || lie === 'tee');
  let pick = usable[0][0];
  for (const [name, yards] of usable) if (yards * scale >= need) pick = name;
  return pick;
}

// How widely a shot scatters around the aim: standard deviations in yards along
// and across the line, and the chance of a mishit. Pushing for the maximum
// distance is where it gets risky.
function shotSpread(golfer, type, lie, carry, max, weather) {
  const s = golfer.skills;
  const skill = type.key === 'lob' || carry < 100 ? s.shortGame : s.accuracy;
  const effort = Math.min(1, carry / max);
  let pct = (0.025 + 0.055 * (1 - skill / 100)) * type.spread;
  const lieSpread = LIE_SPREAD[lie] ?? 1;
  pct *= HARD_LIES.has(lie) ? 1 + (lieSpread - 1) * (1 - 0.5 * s.recovery / 100) : lieSpread;
  pct *= 0.7 + 0.9 * effort ** 3;
  const gust = (weather?.windMph ?? 0) * 0.08 * type.wind;
  let mishit = 0.01 + 0.08 * effort ** 4 * (1 - skill / 150);
  if (lie === 'trees') mishit += 0.1 * (1 - s.recovery / 120);
  if (lie === 'bunker') mishit += 0.06 * (1 - s.recovery / 100);
  return {
    long: Math.max(1.5, carry * pct * 0.8 + gust),
    lat: Math.max(1.5, carry * pct + gust),
    mishit,
  };
}

// Where a point sits on a shot's flight at t from 0 (struck) to 1 (landing):
// ground position in yards plus height `h` in yards. Fades and draws start off
// line and bend back to the landing spot.
function flightPoint(from, to, type, t) {
  const d = dist(from, to) || 1;
  const ux = (to.x - from.x) / d, uy = (to.y - from.y) / d;
  const bend = -type.curve * d * 0.07 * Math.sin(Math.PI * t); // fades start left, draws start right
  const h = type.apex * Math.min(d, 220) * 0.11 * Math.sin(Math.PI * t);
  return { x: from.x + (to.x - from.x) * t + uy * bend, y: from.y + (to.y - from.y) * t - ux * bend, h };
}

// Hit a shot. `ball` is { at, lie }; `aim` is where the golfer wants it to land.
// `wind` is from holeWind (mph along and across the hole). Returns the whole story
// of the shot for animating and scoring.
function playShot(rng, golfer, ball, aim, typeKey, hole, weather, wind) {
  const type = shotType(typeKey);
  const from = ball.at;
  const max = maxCarry(golfer, type, ball.lie, hole);
  let d = dist(from, aim);
  if (d > max) { aim = { x: from.x + (aim.x - from.x) * max / d, y: from.y + (aim.y - from.y) * max / d }; d = max; }
  const ux = (aim.x - from.x) / (d || 1), uy = (aim.y - from.y) / (d || 1);
  const rx = uy, ry = -ux; // to the golfer's right

  const spread = shotSpread(golfer, type, ball.lie, d, max, weather);
  let along = rng.gauss() * spread.long, across = rng.gauss() * spread.lat;
  const mishit = rng.chance(spread.mishit);
  if (mishit) {
    along -= d * rng.range(0.2, 0.45);
    across += (rng.chance(0.5) ? 1 : -1) * d * rng.range(0.1, 0.22);
  }
  // Wind in the hole's frame: `across` is +x and `along` is +y.
  const drift = d * 0.0045 * type.wind;
  const landing = {
    x: aim.x + ux * along + rx * across + wind.across * drift,
    y: aim.y + uy * along + ry * across + wind.along * drift,
  };

  const landedOn = surfaceAt(hole, landing);
  const result = {
    type: typeKey, club: chooseClub(golfer, type, d, ball.lie), from, aim, landing, mishit,
    carry: dist(from, landing), landedOn, rest: landing, surface: landedOn, holed: false,
  };
  if (landedOn === 'water') return result;

  // Roll on along the line of flight, stopping in sand, water or trees, slowing in rough.
  let roll = result.carry * type.roll * (ROLL[landedOn] ?? 0.5) * (1 + 5 * (weather?.firm ?? 0));
  if (type.key === 'lob' && landedOn === 'green') roll *= 0.5;
  const c = result.carry || 1;
  const vx = (landing.x - from.x) / c, vy = (landing.y - from.y) / c;
  let p = landing, s = landedOn;
  for (let left = roll; left > 0; left -= 0.5) {
    const q = { x: p.x + vx * Math.min(0.5, left), y: p.y + vy * Math.min(0.5, left) };
    const t = surfaceAt(hole, q);
    if (t === 'rough' && s !== 'rough') left *= 0.3;
    p = q; s = t;
    if (dist(p, hole.pin) < 0.35 && left < 4) { result.holed = true; p = { ...hole.pin }; break; }
    if (t === 'water' || t === 'bunker' || t === 'trees') break;
  }
  result.rest = p;
  result.surface = s;
  if (dist(p, hole.pin) < 0.35) { result.holed = true; result.rest = { ...hole.pin }; }
  return result;
}

// Where to drop after going in the water: back along the line towards where the
// shot was played from, onto dry land.
function waterDrop(hole, wet, from) {
  const d = dist(wet, from) || 1;
  const ux = (from.x - wet.x) / d, uy = (from.y - wet.y) / d;
  for (let k = 1; k <= d; k++) {
    const p = { x: wet.x + ux * k, y: wet.y + uy * k };
    if (surfaceAt(hole, p) !== 'water') {
      const q = { x: p.x + ux * 2, y: p.y + uy * 2 };
      return surfaceAt(hole, q) === 'water' ? p : q;
    }
  }
  return { ...from };
}

// ---- putting.js ----
// Putting is automatic, as in Sim Golf: the golfer's putting skill and the
// distance decide whether it drops, and if not, how far away it finishes.
// Distances here are yards; the game shows putts in feet.


const feet = (yards) => Math.max(1, Math.round(yards * 3));

// Chance of holing a putt of `ft` feet: about 80% from 3 ft, 45% from 10 ft and
// 5% from 40 ft for an average putter; better putters hold on to it for longer.
function holeChance(golfer, ft) {
  if (ft <= 1.5) return 0.99;
  const reach = 8 + 8 * golfer.skills.putting / 100;
  return Math.min(0.99, Math.exp(-(ft - 1.5) / reach) * (0.9 + 0.1 * golfer.skills.putting / 100));
}

// Roll one putt from `from` at the hole. Returns { holed, rest, feet }.
function putt(rng, golfer, from, pin) {
  const d = dist(from, pin);
  const ft = d * 3;
  if (rng.chance(holeChance(golfer, ft))) return { holed: true, rest: { ...pin }, feet: feet(d) };
  // A miss finishes a few feet away: further on long putts, closer for good putters.
  const leaveFt = 0.8 + Math.abs(rng.gauss()) * ft * (0.07 + 0.1 * (1 - golfer.skills.putting / 100));
  const ux = (pin.x - from.x) / (d || 1), uy = (pin.y - from.y) / (d || 1);
  const past = rng.chance(0.6) ? 1 : -1; // a bold putt goes by
  const a = rng.gauss() * 0.5;
  const ca = Math.cos(a) * past, sa = Math.sin(a);
  const leave = leaveFt / 3;
  return { holed: false, rest: { x: pin.x + (ux * ca - uy * sa) * leave, y: pin.y + (uy * ca + ux * sa) * leave }, feet: feet(d) };
}

// ---- play.js ----
// Playing a hole: whose turn it is, where each ball lies, strokes and penalties.


// Start a hole with every golfer's ball on the given tee.
function startHole(hole, golfers, tee = 'white') {
  const at = pointAt(hole.line, hole.tees[tee]);
  return {
    hole,
    players: golfers.map((golfer) => ({ golfer, at: { ...at }, lie: 'tee', strokes: 0, putts: 0, onGreen: false, holed: false })),
    turn: 0,
  };
}

const current = (state) => state.players[state.turn];
const toPin = (state) => dist(current(state).at, state.hole.pin);

// Hit the current player's shot. Returns the shot plus what it cost, without
// moving the ball yet, so the caller can animate it first and then call `settle`.
function hit(state, rng, aim, typeKey, weather, wind, outOfBounds) {
  const p = current(state);
  const shot = playShot(rng, p.golfer, { at: p.at, lie: p.lie }, aim, typeKey, state.hole, weather, wind);
  shot.penalty = 0;
  shot.next = { at: shot.rest, lie: shot.surface };
  if (shot.surface === 'water') {
    shot.penalty = 1;
    shot.note = 'IN THE WATER. ONE SHOT PENALTY';
    const drop = waterDrop(state.hole, shot.rest, p.at);
    shot.next = { at: drop, lie: surfaceAt(state.hole, drop) };
  } else if (outOfBounds(shot.rest)) {
    shot.penalty = 1;
    shot.note = 'OUT OF BOUNDS. STROKE AND DISTANCE';
    shot.next = { at: { ...p.at }, lie: p.lie };
  } else if (shot.holed) {
    shot.note = 'HOLED IT!';
  } else if (shot.surface === 'green') {
    shot.note = 'ON THE GREEN';
  } else if (shot.mishit) {
    shot.note = 'MISHIT!';
  }
  return shot;
}

// Move the ball to where the shot finished and count the strokes.
function settle(state, shot) {
  const p = current(state);
  p.strokes += 1 + shot.penalty;
  p.at = shot.next.at;
  p.lie = shot.next.lie;
  p.holed = shot.holed;
  p.onGreen = p.lie === 'green';
}

// Roll the current player's next putt, without moving the ball yet.
const nextPutt = (state, rng) => putt(rng, current(state).golfer, current(state).at, state.hole.pin);

function settlePutt(state, p) {
  const me = current(state);
  me.strokes += 1;
  me.putts += 1;
  me.at = p.rest;
  me.holed = p.holed;
}

// A round's scores for each golfer, hole by hole (null until played).
const newRound = (course, key, golfers) => ({
  key, pars: course.holes.map((h) => h.par),
  players: golfers.map((g) => ({ name: g.name, shirt: g.shirt, scores: Array(18).fill(null), putts: Array(18).fill(null) })),
});

// Score against par so far, and how many holes that covers.
function standing(round, i) {
  const done = round.players[i].scores.map((sc, h) => (sc == null ? null : sc - round.pars[h])).filter((d) => d != null);
  return { toPar: done.reduce((t, d) => t + d, 0), holes: done.length };
}

// Golf's order of play: whoever is furthest from the hole goes next. On the tee,
// everyone is level, so the order the golfers were listed in decides.
function nextTurn(state) {
  let best = -1, far = -1;
  state.players.forEach((p, i) => {
    if (p.holed) return;
    const d = dist(p.at, state.hole.pin);
    if (d > far + 0.01) { far = d; best = i; }
  });
  return best;
}

const allHoled = (state) => state.players.every((p) => p.holed);

// A golfer who reaches this many strokes picks up and takes it as their score.
const PICK_UP = 10;
function pickUp(state) {
  const me = current(state);
  me.strokes = PICK_UP;
  me.holed = true;
}

// ---- ai.js ----
// How a computer golfer picks its shot: it tries a spread of shot types and
// landing spots, plays each one a few times in its head with the real shot
// model (wind and all), and takes the one that leaves the fewest strokes,
// counting the risk of a bad outcome according to its nerve.


const LIE_COST = { tee: 0, fairway: 0, fringe: -0.05, green: 0, rough: 0.3, waste: 0.3, bunker: 0.45, trees: 0.8 };

// A rough guess at the strokes still needed to hole out from a spot.
function strokesLeft(golfer, hole, p, lie) {
  const d = dist(p, hole.pin);
  if (lie === 'green') {
    const ft = d * 3;
    return 1 + (1 - holeChance(golfer, ft)) * (ft > 30 ? 1.25 : 1.05);
  }
  const reach = maxCarry(golfer, SHOT_TYPES[0], 'fairway', hole);
  return 1.9 + 0.95 * d / reach + (LIE_COST[lie] ?? 0.3);
}

// Landing spots worth trying: a fan of lines either side of the pin at several
// lengths, the pin itself, and points down the middle of the hole (for doglegs).
function candidateAims(golfer, ball, hole, type) {
  const max = maxCarry(golfer, type, ball.lie, hole);
  const toPin = dist(ball.at, hole.pin);
  const aims = [];
  const base = Math.atan2(hole.pin.y - ball.at.y, hole.pin.x - ball.at.x);
  for (const turn of [-0.6, -0.35, -0.18, -0.08, 0, 0.08, 0.18, 0.35, 0.6]) {
    for (const f of [0.55, 0.7, 0.85, 1]) {
      const d = Math.min(toPin * 1.02, max) * f;
      aims.push({ x: ball.at.x + Math.cos(base + turn) * d, y: ball.at.y + Math.sin(base + turn) * d });
    }
  }
  if (toPin <= max) aims.push({ ...hole.pin });
  const s0 = Math.max(0, project(hole.line, ball.at).s);
  for (let s = s0 + 60; s < hole.line.length; s += 25) {
    const p = pointAt(hole.line, s);
    if (dist(ball.at, p) <= max) aims.push(p);
  }
  return aims;
}

// Which shots are worth considering from here.
function typesToTry(golfer, ball, hole) {
  const toPin = dist(ball.at, hole.pin);
  const lob = maxCarry(golfer, shotType('lob'), ball.lie, hole);
  if (toPin < lob * 0.9) return ['lob', 'runner', 'straight'];
  if (ball.lie === 'trees') return ['runner', 'straight', 'lob'];
  return ['straight', 'fade', 'draw', 'runner'];
}

// Pick a shot: returns { type, aim, expected } where `expected` is the strokes it
// expects to need from here, including this one.
function planShot(golfer, ball, hole, weather, wind, outOfBounds, seed, tries = 16) {
  const rng = makeRng(seed);
  const caution = 0.15 + 0.7 * (1 - (golfer.nerve ?? 0.5)); // how much a spread of outcomes puts it off
  let best = null;
  for (const typeKey of typesToTry(golfer, ball, hole)) {
    for (const aim of candidateAims(golfer, ball, hole, shotType(typeKey))) {
      const costs = [];
      for (let i = 0; i < tries; i++) {
        const s = playShot(rng, golfer, ball, aim, typeKey, hole, weather, wind);
        let cost;
        if (s.holed) cost = 1;
        else if (s.surface === 'water') {
          const drop = waterDrop(hole, s.rest, ball.at);
          cost = 2 + strokesLeft(golfer, hole, drop, surfaceAt(hole, drop));
        } else if (outOfBounds(s.rest)) cost = 2 + strokesLeft(golfer, hole, ball.at, ball.lie);
        else cost = 1 + strokesLeft(golfer, hole, s.rest, s.surface);
        costs.push(cost);
      }
      const mean = costs.reduce((a, b) => a + b, 0) / tries;
      const sd = Math.sqrt(costs.reduce((a, b) => a + (b - mean) ** 2, 0) / tries);
      const score = mean + caution * sd + rng.range(0, 0.04); // a touch of variety
      if (!best || score < best.score) best = { type: typeKey, aim, expected: mean, score };
    }
  }
  return best;
}

// ---- main.js ----
// Play a round on a generated course against a computer golfer. Pick a shot,
// drag out where it should land, then hit it; putting on the green plays itself.
// The URL can pick the course: ?style=tropical&seed=1989&hole=1


const STYLE_KEYS = Object.keys(STYLES);
const TEE = 'white';
const GOLFERS = [PLAYER, RIVAL];
// Spare picture round the whole-hole view, so there's somewhere to pan when zoomed in.
const MARGIN = 200;
const MAX_ZOOM = 2;

// Two canvases fill the window: the hole, scaled up by `fitScale + zoom`, and the
// panels on top, always at `fitScale`. Both keep their pixels square and crisp.
const canvas = document.getElementById('game');
const hudCanvas = document.getElementById('hud');
const ctx = canvas.getContext('2d');
const hud = hudCanvas.getContext('2d');
const rng = makeRng(Math.floor(Math.random() * 2 ** 31));

const params = new URLSearchParams(location.search);
const settings = {
  style: STYLE_KEYS.includes(params.get('style')) ? params.get('style') : 'tropical',
  seed: Number(params.get('seed')) || 1989,
  hole: Math.min(18, Math.max(1, Number(params.get('hole')) || 1)),
};

// fitScale: screen pixels per game pixel when the whole hole is shown. W x H: the
// game's size in pixels at that scale (the panels are laid out on this).
// zoom is the player's choice; onGreen zooms right in while putting.
const display = { fitScale: 1, W: 0, H: 0, zoom: 0, onGreen: false };
const cam = { x: MARGIN, y: MARGIN, manual: false };
let game, world, round;
// phase: 'aim' (waiting for a shot), 'flight', 'roll', 'putting' (putts playing
// out on the green), 'done'. aiAt/aiPlanned pace the computer golfer's turn.
const ui = {
  shot: 'straight', humanShot: 'straight', dragging: false, aim: null, phase: 'aim', anim: null, banner: null,
  card: false, nextPuttAt: 0, aiAt: 0, aiPlanned: false,
  pop: null,  // a picture banner, e.g. BIRDIE: { names, start, until }
  moods: [],  // golfers celebrating or sulking after holing out: { kind, until } by player
};

const SWING = 450; // ms for the swing before the ball leaves

const zoomNow = () => (display.onGreen ? MAX_ZOOM : display.zoom);
const scale = () => display.fitScale + zoomNow();

function sizeCanvas(c, k) {
  c.width = Math.ceil(innerWidth / k);
  c.height = Math.ceil(innerHeight / k);
  c.style.width = `${c.width * k}px`;
  c.style.height = `${c.height * k}px`;
}

// Fit the game to the window: the biggest whole-number scale that leaves at least 800 x 450 game pixels.
function measure() {
  // Scale up as far as the window allows while keeping at least 640 x 360 game pixels.
  display.fitScale = Math.max(1, Math.floor(Math.min(innerWidth / 640, innerHeight / 360)));
  sizeCanvas(hudCanvas, display.fitScale);
  sizeCanvas(canvas, scale());
  display.W = hudCanvas.width;
  display.H = hudCanvas.height;
}

// Draw the hole once into a picture big enough for the whole-hole view plus a margin.
function buildWorld() {
  const { W, H } = display;
  const fit = layoutHole(game.hole, { x: 8, y: 54, w: W - 16, h: BAR_TOP(H) - 60 });
  const view = shiftView(fit, MARGIN, MARGIN);
  const w = W + 2 * MARGIN, h = H + 2 * MARGIN;
  addSurroundings(view, game.course, game.hole.number - 1, w, h);
  const img = new ImageData(w, h);
  drawHole(new Uint32Array(img.data.buffer), w, h, game.hole, view);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').putImageData(img, 0, 0);
  world = { canvas: c, view, w, h };
  aimCamera(true);
}

function loadHole() {
  const course = buildCourse({ name: `Course ${settings.seed}`, style: settings.style, par: 72, length: 'standard', seed: settings.seed });
  const hole = course.holes[settings.hole - 1];
  const weather = roundWeather(course);
  game = { course, hole, weather, wind: holeWind(weather, hole), play: startHole(hole, GOLFERS, TEE) };
  // Scores carry on from hole to hole on the same course.
  const key = `${settings.style}:${settings.seed}`;
  if (round?.key !== key) round = newRound(course, key, GOLFERS);
  Object.assign(ui, { dragging: false, aim: null, phase: 'aim', anim: null, banner: null, card: false, cardAt: 0, pop: null, moods: [] });
  greenZoom(false);
  cam.manual = false;
  buildWorld();
  startTurn(performance.now());
  // Keep the address shareable where the page is allowed to change it.
  try { history.replaceState(null, '', `?style=${settings.style}&seed=${settings.seed}&hole=${settings.hole}`); } catch { /* sandboxed */ }
}

// ---------- Camera ----------

// Whole hole: fixed. Zoomed in: follow the ball (unless the player has panned).
function aimCamera(snap) {
  if (zoomNow() === 0) { cam.x = MARGIN; cam.y = MARGIN; cam.manual = false; return; }
  if (cam.manual) return;
  // While aiming, keep both the ball and the aim in view.
  const ball = ballNow(performance.now());
  const focus = ui.aim && ui.phase === 'aim' ? { x: (ball.x + ui.aim.x) / 2, y: (ball.y + ui.aim.y) / 2 } : ball;
  const b = world.view.worldToScreen(focus);
  const tx = b.x - canvas.width / 2, ty = b.y - canvas.height / 2;
  cam.x = snap ? tx : cam.x + (tx - cam.x) * 0.12;
  cam.y = snap ? ty : cam.y + (ty - cam.y) * 0.12;
  clampCamera();
}

function clampCamera() {
  cam.x = Math.max(0, Math.min(world.w - canvas.width, cam.x));
  cam.y = Math.max(0, Math.min(world.h - canvas.height, cam.y));
}

function setZoom(z) {
  z = Math.max(0, Math.min(MAX_ZOOM, z));
  if (z === display.zoom) return;
  display.zoom = z;
  rescale();
}

function greenZoom(on) {
  if (on === display.onGreen) return;
  display.onGreen = on;
  if (world) rescale();
}

function rescale() {
  sizeCanvas(canvas, scale());
  cam.manual = false;
  aimCamera(true);
}

// ---------- Shots ----------

// The aim clamped to what the current shot can reach.
function clampAim(p) {
  const me = current(game.play);
  const max = maxCarry(me.golfer, shotType(ui.shot), me.lie, game.hole);
  const d = dist(me.at, p);
  return d <= max ? p : { x: me.at.x + (p.x - me.at.x) * max / d, y: me.at.y + (p.y - me.at.y) * max / d };
}

const humanTurn = () => !current(game.play).golfer.ai;

function shoot() {
  if (ui.phase !== 'aim' || !ui.aim) return;
  const shot = hit(game.play, rng, ui.aim, ui.shot, game.weather, game.wind, (p) => isOutOfBounds(world.view, p));
  const rollLen = dist(shot.landing, shot.rest);
  const swingAt = performance.now();
  ui.anim = { shot, swingAt, start: swingAt + SWING, flight: 700 + shot.carry * 4, roll: rollLen > 0.5 ? 250 + rollLen * 25 : 0 };
  ui.phase = 'flight';
  ui.aim = null;
  ui.dragging = false;
  cam.manual = false;
}

function cancelAim() {
  if (!humanTurn()) return;
  ui.dragging = false;
  ui.aim = null;
}

function pickShot(key) {
  if (!humanTurn()) return;
  ui.shot = ui.humanShot = key;
  if (ui.aim) ui.aim = clampAim(ui.aim);
}

// Where the ball is right now, in yards, with its height.
function ballNow(now) {
  const me = current(game.play);
  const a = ui.anim;
  if (!a) return { ...me.at, h: 0 };
  const t = (now - a.start) / a.flight;
  if (t < 0) return { ...a.shot.from, h: 0 }; // still swinging
  if (t < 1) return flightPoint(a.shot.from, a.shot.landing, shotType(a.shot.type), t);
  const r = a.roll ? Math.min(1, (now - a.start - a.flight) / a.roll) : 1;
  const e = 1 - (1 - r) ** 2; // slows as it rolls out
  return { x: a.shot.landing.x + (a.shot.rest.x - a.shot.landing.x) * e, y: a.shot.landing.y + (a.shot.rest.y - a.shot.landing.y) * e, h: 0 };
}

function update(now) {
  if (ui.phase === 'putting') return updatePutting(now);
  if (ui.phase === 'aim' && !humanTurn()) return updateComputer(now);
  const a = ui.anim;
  if (!a) return;
  if (ui.phase === 'flight' && now - a.start >= a.flight) ui.phase = 'roll';
  if (ui.phase === 'roll' && now - a.start >= a.flight + a.roll) {
    settle(game.play, a.shot);
    ui.anim = null;
    const me = current(game.play);
    let note = a.shot.note;
    const pic = note?.startsWith('OUT OF BOUNDS') ? 'txt-ob' : !me.holed && !note?.startsWith('IN THE WATER') && LIE_BANNERS[me.lie];
    if (pic) {
      showPop([pic], now);
      if (note === 'ON THE GREEN') note = null; // the picture says it
    }
    afterStroke(now, note);
  }
}

// The computer golfer thinks, shows where it's aiming, then hits.
function updateComputer(now) {
  if (now < ui.aiAt) return;
  if (!ui.aiPlanned) {
    const me = current(game.play);
    const plan = planShot(me.golfer, { at: me.at, lie: me.lie }, game.hole, game.weather, game.wind, (p) => isOutOfBounds(world.view, p), rng.int(0, 2 ** 30));
    ui.shot = plan.type;
    ui.aim = plan.aim;
    ui.aiPlanned = true;
    ui.aiAt = now + 1200;
    return;
  }
  ui.aiPlanned = false;
  shoot();
}

const who = (golfer) => golfer.name.toUpperCase();
const showPop = (names, now) => { ui.pop = { names, start: now, until: now + 1900 }; };
const yourTurn = (golfer) => (golfer.ai ? `${who(golfer)} TO PLAY` : 'YOUR SHOT');

// After any stroke: note a holed ball, then hand over to whoever is furthest away.
function afterStroke(now, note) {
  const me = current(game.play);
  if (!me.holed && me.strokes >= PICK_UP) {
    pickUp(game.play);
    note = `${who(me.golfer)} PICKS UP`;
  }
  if (me.holed) {
    round.players[game.play.turn].scores[game.hole.number - 1] = me.strokes;
    round.players[game.play.turn].putts[game.hole.number - 1] = me.putts;
    const name = me.strokes === 1 ? 'HOLE IN ONE' : scoreName(me.strokes - game.hole.par);
    if (me.strokes < PICK_UP) note = `${who(me.golfer)}: ${name}! ${me.strokes} SHOTS`;
    const pics = scoreBanner(me.strokes, game.hole.par);
    if (pics.length) showPop(pics, now);
    ui.moods[game.play.turn] = { kind: me.strokes <= game.hole.par ? 'joy' : 'cry', until: now + 2800 };
  }
  if (allHoled(game.play)) return holeFinished();
  startTurn(now, note);
}

function startTurn(now, note) {
  game.play.turn = nextTurn(game.play);
  const me = current(game.play);
  Object.assign(ui, { anim: null, aim: null, dragging: false, aiPlanned: false });
  const turn = me.onGreen ? (me.golfer.ai ? `${who(me.golfer)} TO PUTT` : 'YOUR PUTT') : yourTurn(me.golfer);
  ui.banner = note ? { text: note, sub: turn, until: now + 2200 } : { text: turn, until: now + 1200 };
  if (me.onGreen) {
    ui.phase = 'putting';
    ui.nextPuttAt = now + (note ? 2000 : 1100);
    greenZoom(true);
  } else {
    ui.phase = 'aim';
    greenZoom(false);
    if (me.golfer.ai) ui.aiAt = now + (note ? 2000 : 1000);
    else ui.shot = ui.humanShot;
  }
  cam.manual = false;
}

// Putts play out one at a time, with a pause between them.
function updatePutting(now) {
  const a = ui.anim;
  if (!a) {
    if (now < ui.nextPuttAt) return;
    const me = current(game.play);
    const p = nextPutt(game.play, rng);
    ui.anim = { putt: p, shot: { from: me.at, landing: me.at, rest: p.rest }, start: now, flight: 0, roll: Math.min(2500, 500 + p.feet * 30) };
    ui.banner = { text: `PUTT FROM ${p.feet} FT`, until: Infinity };
    return;
  }
  if (now - a.start < a.roll) return;
  settlePutt(game.play, a.putt);
  ui.anim = null;
  const me = current(game.play);
  afterStroke(now, me.holed ? null : `MISSED. ${feet(dist(me.at, game.hole.pin))} FT LEFT`);
}

// Everyone's round so far against par, e.g. 'YOU +2  BERTIE E'.
function standings() {
  return round.players.map((p, i) => {
    const st = standing(round, i);
    return st.holes ? `${p.name.toUpperCase()} ${st.toPar === 0 ? 'E' : st.toPar > 0 ? `+${st.toPar}` : st.toPar}` : '';
  }).filter(Boolean).join('  ');
}

// Everyone's holed out: show the hole's result and the card.
function holeFinished() {
  ui.phase = 'done';
  ui.cardAt = ui.pop ? ui.pop.until : 1; // let the last BIRDIE (or BOGEY) show before the card covers it
  ui.anim = null;
  const last = game.hole.number === 18;
  const result = game.play.players.map((p) => `${who(p.golfer)} ${p.strokes}`).join(', ');
  ui.banner = { text: result, sub: last ? 'ROUND OVER. ENTER FOR A NEW ROUND' : 'ENTER FOR THE NEXT HOLE', until: Infinity };
}

const scoreName = (d) => ({ '-3': 'ALBATROSS', '-2': 'EAGLE', '-1': 'BIRDIE', 0: 'PAR', 1: 'BOGEY', 2: 'DOUBLE BOGEY' })[d] ?? (d < 0 ? `${-d} UNDER` : `${d} OVER`);

// ---------- Drawing ----------

// A picture banner (BIRDIE, IN THE ROUGH...) that drops in under the text banner.
function drawPop(g, W, H, now) {
  const drop = Math.max(0, 1 - (now - ui.pop.start) / 220);
  let y = Math.round(H * 0.28 - 14 * drop * drop);
  for (const name of ui.pop.names) {
    const size = dinkySize(name);
    if (!size) return;
    drawDinky(g, name, Math.round(W / 2 - size.w / 2), y, null, true);
    y += size.h + 2;
  }
}

const LIE_NAMES = { tee: 'TEE', fairway: 'FAIRWAY', fringe: 'FRINGE', green: 'GREEN', rough: 'ROUGH', waste: 'WASTE GROUND', bunker: 'BUNKER', trees: 'TREES' };

function dot(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
}

// Yards of height to pixels on display.
const heightPx = (h) => h / world.view.grid.cell * TH * 1.5;

// The planned shot: its flight as a dotted arc, and an oval where it's likely to land.
function drawAim() {
  const me = current(game.play);
  const type = shotType(ui.shot);
  const v = world.view;
  const d = dist(me.at, ui.aim);
  const steps = Math.max(12, Math.round(d / 2));
  for (let k = 1; k < steps; k += 2) {
    const p = flightPoint(me.at, ui.aim, type, k / steps);
    const s = v.worldToScreen(p);
    dot(s.x, s.y, 'rgba(0, 0, 0, 0.25)');
    dot(s.x, s.y - heightPx(p.h), '#ffffff');
  }
  const max = maxCarry(me.golfer, type, me.lie, game.hole);
  const sp = shotSpread(me.golfer, type, me.lie, d, max, game.weather);
  const ux = (ui.aim.x - me.at.x) / (d || 1), uy = (ui.aim.y - me.at.y) / (d || 1);
  // Redder as the shot gets riskier.
  const risk = Math.min(1, (d / max) ** 3 + sp.mishit * 3);
  const col = `rgb(255, ${Math.round(240 - 170 * risk)}, ${Math.round(120 - 100 * risk)})`;
  for (let k = 0; k < 48; k++) {
    const a = k / 48 * Math.PI * 2;
    const along = Math.cos(a) * sp.long * 1.5, across = Math.sin(a) * sp.lat * 1.5;
    const s = v.worldToScreen({ x: ui.aim.x + ux * along + uy * across, y: ui.aim.y + uy * along - ux * across });
    dot(s.x, s.y, col);
  }
  const c = v.worldToScreen(ui.aim);
  for (const [dx, dy] of [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]]) dot(c.x + dx, c.y + dy, col);
}

function render(now) {
  const v = world.view;
  const me = current(game.play);
  ctx.setTransform(1, 0, 0, 1, -Math.round(cam.x), -Math.round(cam.y));
  ctx.drawImage(world.canvas, 0, 0);

  if (ui.phase === 'aim' && ui.aim) drawAim();

  // Each golfer stands beside their ball (or where they played from while it's
  // moving); whoever isn't playing steps to the other side so they don't overlap.
  // Someone who's just holed out stays by the hole for a moment to celebrate or sulk.
  // Flags and golfers are drawn back to front.
  const items = [];
  const pins = [game.hole.pin, ...v.others.map((o) => o.toHere(o.hole.pin))];
  for (const pin of pins) {
    const at = v.worldToScreen(pin);
    items.push({ y: at.y, draw: () => drawDinky(ctx, flagFrame(now), at.x, at.y) || drawSprite(ctx, 'flag', at.x, at.y) });
  }
  game.play.players.forEach((p, i) => {
    const playing = i === game.play.turn;
    const mood = ui.moods[i] && now < ui.moods[i].until ? ui.moods[i] : null;
    if (p.holed && !mood) return;
    const a = playing ? ui.anim : null;
    const from = a ? a.shot.from : p.at;
    const stand = v.worldToScreen(from);
    const ball = playing ? ballNow(now) : { ...p.at, h: 0 };
    const pose = mood ? mood.kind : a?.swingAt ? 'swing' : 'stand';
    const frame = golferFrame(pose, a?.swingAt ? (now - a.swingAt) / SWING : 0, now);
    const x = stand.x + (mood ? 9 : playing ? -5 : 6); // after holing, stand clear of the flag
    items.push({ y: stand.y, draw: () => drawDinky(ctx, frame, x, stand.y + 1, p.golfer.shirt) || drawSprite(ctx, 'golfer', x, stand.y, { c: p.golfer.shirt }) });
    if (p.holed) return;
    const s = v.worldToScreen(ball);
    items.push({ y: s.y + 0.5, draw: () => {
      const y = Math.round(s.y - heightPx(ball.h)), bx = Math.round(s.x);
      if (ball.h > 0.3) { ctx.fillStyle = 'rgba(0, 0, 0, 0.45)'; ctx.fillRect(bx - 1, Math.round(s.y), 2, 1); }
      if (ball.h > 4 && drawDinky(ctx, ballFrame(ball.h), bx, y + 1)) return;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx - 1, y - 1, 2, 2);
    } });
  });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  const { W, H } = display;
  hud.clearRect(0, 0, W, H);
  drawHud(hud, W, H, { course: game.course, hole: game.hole, tee: TEE, weather: game.weather, wind: game.wind, windScreen: v.worldDirToScreen(game.wind.across, game.wind.along), standing: standings() });
  const type = shotType(ui.shot);
  const max = Math.round(maxCarry(me.golfer, type, me.lie, game.hole));
  const aimYds = ui.aim ? Math.round(dist(me.at, ui.aim)) : 0;
  const canHit = ui.phase === 'aim' && !!ui.aim && !ui.dragging && humanTurn();
  drawShotBar(hud, W, H, {
    types: SHOT_TYPES, selected: ui.shot, max, aim: aimYds, canHit,
    club: chooseClub(me.golfer, type, aimYds || max, me.lie).toUpperCase(),
    lie: LIE_NAMES[me.lie] ?? me.lie.toUpperCase(), toPin: Math.round(toPin(game.play)), stroke: me.holed ? me.strokes : me.strokes + 1,
    hint: !humanTurn() && ui.phase !== 'done' ? `${who(me.golfer)} IS PLAYING` : ui.phase === 'putting' ? 'PUTTING...' : ui.phase !== 'aim' ? '' : !ui.aim ? 'DRAG ON THE COURSE TO AIM' : ui.dragging ? 'LET GO TO SET THE AIM' : 'CHANGE SHOT OR DRAG AGAIN',
  });
  if (ui.banner && now < ui.banner.until) drawBanner(hud, W, ui.banner.text, ui.banner.sub);
  if (ui.pop && now < ui.pop.until) drawPop(hud, W, H, now);
  if (ui.cardAt && now >= ui.cardAt) { ui.card = true; ui.cardAt = 0; }
  if (ui.card) {
    const played = round.players[0].scores.filter((s) => s != null).length;
    drawScorecard(hud, W, H, round, game.hole.number, played === 18 ? 'ROUND COMPLETE' : `${game.course.name.toUpperCase()}  SCORECARD`);
  }
}

function frame(now) {
  update(now);
  aimCamera(false);
  render(now);
  requestAnimationFrame(frame);
}

// ---------- Input ----------

// Mouse position in panel pixels, and on the hole in yards.
const toHud = (e) => ({ x: e.clientX / display.fitScale, y: e.clientY / display.fitScale });
const toYards = (e) => world.view.screenToWorld(e.clientX / scale() + Math.round(cam.x), e.clientY / scale() + Math.round(cam.y));
const inside = (p, b) => p.x >= b.x && p.x < b.x + b.w && p.y >= b.y && p.y < b.y + b.h;

canvas.addEventListener('mousedown', (e) => {
  if (e.button === 2) { cancelAim(); return; }
  if (e.button !== 0) return;
  const p = toHud(e);
  if (p.y >= BAR_TOP(display.H)) {
    const b = shotButtons(display.H, SHOT_TYPES.length).findIndex((r) => inside(p, r));
    if (b >= 0) pickShot(SHOT_TYPES[b].key);
    const act = actionButtons(display.W, display.H);
    if (inside(p, act.hit) && humanTurn()) shoot();
    if (inside(p, act.cancel)) cancelAim();
    return;
  }
  if (ui.phase !== 'aim' || !humanTurn()) return;
  ui.dragging = true;
  ui.aim = clampAim(toYards(e));
});
addEventListener('mousemove', (e) => {
  if (ui.dragging) ui.aim = clampAim(toYards(e));
});
addEventListener('mouseup', (e) => {
  if (!ui.dragging || e.button !== 0) return;
  ui.dragging = false;
  // Letting go sets the aim; it's hit with the HIT button or space.
  if (ui.aim && dist(current(game.play).at, ui.aim) < 5) ui.aim = null;
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => { e.preventDefault(); setZoom(display.zoom + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });

const PAN = { arrowleft: [-1, 0], arrowright: [1, 0], arrowup: [0, -1], arrowdown: [0, 1] };

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '5') return pickShot(SHOT_TYPES[Number(k) - 1].key);
  if (k === ' ') { e.preventDefault(); return humanTurn() && shoot(); }
  if (k === 'escape') return cancelAim();
  if (k === '+' || k === '=') return setZoom(display.zoom + 1);
  if (k === '-' || k === '_') return setZoom(display.zoom - 1);
  if (PAN[k] && display.zoom > 0) {
    e.preventDefault();
    cam.manual = true;
    cam.x += PAN[k][0] * 24; cam.y += PAN[k][1] * 24;
    return clampCamera();
  }
  if (k === 'c') { cam.manual = false; return; }
  if (k === 'tab') { e.preventDefault(); ui.card = !ui.card; ui.cardAt = 0; return; }
  if (k === 'enter' && ui.phase === 'done') {
    // On to the next hole, or a fresh round after the 18th.
    if (game.hole.number === 18) { settings.hole = 1; round = null; } else settings.hole += 1;
    return loadHole();
  }
  if (k === 'n') settings.hole = settings.hole % 18 + 1;
  else if (k === 'p') settings.hole = (settings.hole + 16) % 18 + 1;
  else if (k === 'r') { settings.seed = Math.floor(Math.random() * 1e6); settings.hole = 1; }
  else if (k === 's') settings.style = STYLE_KEYS[(STYLE_KEYS.indexOf(settings.style) + 1) % STYLE_KEYS.length];
  else if (k !== 'enter') return;
  loadHole();
});

// Redraw the hole for the new window size once resizing settles.
let resizing;
addEventListener('resize', () => {
  clearTimeout(resizing);
  resizing = setTimeout(() => { measure(); buildWorld(); }, 150);
});
